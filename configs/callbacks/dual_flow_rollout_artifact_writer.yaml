# Stream DualFlow rollouts during predict().

dual_flow_rollout_artifact_writer:
  _target_: src.callbacks.dual_flow_rollout_artifact_writer.DualFlowRolloutArtifactWriter
  output_dir: ${dataset.artifact_dir}/eval_dual_flow
  split: ${run.split}
  enabled: true
  artifact_name: eval_dual_flow
  schema_version: 1
  textualize: false
  entity_vocab_path: ${dataset.out_dir}/entity_vocab.parquet
  relation_vocab_path: ${dataset.out_dir}/relation_vocab.parquet
  questions_path: ${dataset.out_dir}/questions.parquet
  overwrite: true
