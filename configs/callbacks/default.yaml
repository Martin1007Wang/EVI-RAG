# Default training callback bundle.
model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "step_{step:07d}-recall10_{recall10:.4f}"
  monitor: "val/${dataset.dataset_scope}/answer/recall@10"
  save_top_k: 3
  save_last: true
  mode: max
  every_n_train_steps: 1000 

early_stopping:
  _target_: lightning.pytorch.callbacks.EarlyStopping
  monitor: "val/${dataset.dataset_scope}/answer/recall@10"
  min_delta: 0.001
  patience: 10
  verbose: true
  mode: max
  strict: true
  check_finite: True

model_summary:
  _target_: lightning.pytorch.callbacks.RichModelSummary
  max_depth: -1

rich_progress_bar:
  _target_: lightning.pytorch.callbacks.RichProgressBar
