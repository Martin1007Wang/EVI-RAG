# Default training callback bundle.
model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "step_{step:07d}"
  monitor: "val/${dataset.dataset_scope}/answer/recall@10"
  verbose: False
  save_last: True
  save_top_k: 1
  mode: "max"
  auto_insert_metric_name: False
  save_weights_only: False
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: null

early_stopping:
  _target_: src.callbacks.step_early_stopping.LoggedMetricEarlyStopping
  monitor: "val/${dataset.dataset_scope}/answer/recall@10"
  min_delta: 0.0
  # Train runs can rewrite this from `fit_schedule` before callback instantiation.
  patience: 10
  verbose: False
  mode: "max"
  strict: True
  check_finite: True
  stopping_threshold: null
  divergence_threshold: null
  check_on_train_epoch_end: false

model_summary:
  _target_: lightning.pytorch.callbacks.RichModelSummary
  max_depth: -1

rich_progress_bar:
  _target_: lightning.pytorch.callbacks.RichProgressBar

local_metrics_writer:
  _target_: src.callbacks.local_metrics_writer.LocalMetricsWriter
  output_dir: ${paths.output_dir}/metrics
  enabled: true
  train_window_size: 32
