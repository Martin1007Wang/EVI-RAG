model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/${dataset.dataset_scope}/answer/gold_mass"
  verbose: False
  save_last: True
  save_top_k: 1
  mode: "max"
  auto_insert_metric_name: False
  save_weights_only: False
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: null

early_stopping:
  _target_: src.callbacks.step_early_stopping.StepEarlyStopping
  monitor: "val/${dataset.dataset_scope}/answer/gold_mass"
  min_delta: 0.0
  patience: 10
  verbose: False
  mode: "max"
  strict: True
  check_finite: True
  stopping_threshold: null
  divergence_threshold: null
  check_on_train_epoch_end: false

model_summary:
  _target_: lightning.pytorch.callbacks.RichModelSummary
  max_depth: -1

rich_progress_bar:
  _target_: lightning.pytorch.callbacks.RichProgressBar

local_metrics_writer:
  _target_: src.callbacks.local_metrics_writer.LocalMetricsWriter
  output_dir: ${paths.output_dir}/metrics
  enabled: true
  train_window_size: 256

prediction_artifacts_writer:
  _target_: src.callbacks.prediction_artifacts_writer.PredictionArtifactsWriter
  enabled: ${oc.select:run.write_artifacts,false}
  execution_mode: ${oc.select:run.execution_mode,${oc.select:run.eval_mode,predict}}
  output_root: ${oc.select:dataset.artifact_dir,null}
  artifact_subdir: ${oc.select:run.artifact_subdir,eval_answer_reachability}
  artifact_name: ${oc.select:run.artifact_name,eval_answer_reachability}
  schema_version: ${oc.select:run.artifact_schema_version,1}
  split: ${oc.select:run.split,test}
  dataset_scope: ${oc.select:dataset.dataset_scope,null}
  dataset_variant: ${oc.select:run.dataset_variant,null}
  entity_vocab_path: ${oc.select:dataset.paths.entity_vocab,null}
  relation_vocab_path: ${oc.select:dataset.paths.relation_vocab,null}
  questions_path: ${oc.select:run.questions_path,null}
  dataset_out_dir: ${oc.select:dataset.out_dir,null}
  overwrite: ${oc.select:run.artifact_overwrite,true}
