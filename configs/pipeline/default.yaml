# @package _global_
validate_graph_edges: true
dedup_edges: true
remove_self_loops: true
expand_budget: 3

# Preprocess-time sample retention rules before LMDB materialization.
preprocess_filter:
  train:
    skip_no_question_entity: true
    skip_no_ans: false
    skip_no_path: false
    skip_no_train_target: true
  eval:
    skip_no_question_entity: true
    skip_no_ans: false
    skip_no_path: false
    skip_no_train_target: false

# For *-sub datasets: emit a prepared-sample filter containing only
# samples with an in-graph answer path.
emit_sub_filter: true
sub_filter_filename: sub_filter.json

lmdb_shards: 1
map_size_gb: 128
overwrite_lmdb: true