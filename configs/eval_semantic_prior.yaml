# Entrypoint rules for `python src/eval_semantic_prior.py ...`

defaults:
  - _self_
  - dataset: null
  - data: datamodule
  - paths: default
  - hydra: default

task_name: eval_semantic_prior
seed: 42

# Split to score with the oracle ranking experiment.
split: ${dataset.val_split}

# Random subsample size. Set null or <=0 to evaluate the entire split.
max_graphs: 1000

# Match shortest-path supervision to the rollout geometry by default.
path_mode: undirected

# Compare several semantic baselines in one pass.
scoring_methods:
  - random
  - relation_only
  - tail_only
  - rel_tail_concat

top_ks: [1, 10]
