# DataLoader settings for SubgraphRAG-style retriever export/eval.

_target_: src.datasets.g_retrieval_datamodule.GRetrievalDataModule

dataset_cfg: ${dataset}

batch_size: 1
num_workers: 8
pin_memory: true
drop_last: false
train_shuffle: false
prefetch_factor: 4
persistent_workers: true

precompute_edge_batch: false

embeddings_device: cpu

expand_multi_answer: false
filter_zero_hop: false
