# configs/data/graph_retrieval.yaml

_target_: src.datasets.graph_retrieval_datamodule.GraphRetrievalDataModule

# Data contract metadata. This block is stripped before hydra instantiation.
contract:
  requires_dataset_cfg: true
  intended_entrypoints: [train, eval]
  expand_multi_answer: false
  retains_zero_hop: true
  embeddings_device_default: cpu

dataset_cfg: ${dataset}

# === Dataloader 逻辑参数 ===
batch_size: 16
# Eval defaults to the train batch size unless experiments explicitly raise it.
eval_batch_size: null
num_workers: 8
# Force both train and eval workers to use `spawn`; long-running webqsp-sub fits
# proved that Linux `fork` can corrupt worker state and trigger later segfaults.
# Keep worker count conservative because `spawn` startup cost dominates cold-start
# latency once the loader is unsized.
multiprocessing_context: spawn
eval_num_workers: 8
eval_multiprocessing_context: spawn
drop_last: false
train_shuffle: true
# Train loader is intentionally unsized so Lightning never blocks on
# `len(train_dataloader())`; fit lifetime comes from `fit_schedule` / `max_steps`.
train_num_samples: null
# 如需缩短训练，优先使用 Trainer 的 `limit_train_batches` / `max_steps`；如需有限采样调试，
# 可显式覆盖 `data.train_num_samples=<positive-int>`。
# Keep prefetch modest under `spawn`; higher values amplify cold-start and host-memory
# pressure without helping the first step.
prefetch_factor: 2
eval_prefetch_factor: 2
persistent_workers: true
eval_persistent_workers: true
precompute_edge_batch: true
# Node/question embedding tensors are prepared on CPU and moved with the batch.
embeddings_device: cpu
train_feature_dtype: null
eval_feature_dtype: null
train_max_graphs_per_batch: null
train_max_nodes_per_batch: null
train_max_edges_per_batch: null
train_max_question_tokens_per_batch: null
# Eval runners may replay train/validation/test by mutating `run.split`.
eval_split: ${oc.select:run.split,test}
# 多答案由模型/奖励处理；DataLoader 不展开。
expand_multi_answer: false
# Zero-hop (q in A) 保留；需配合 stop_min_steps=1（真实步数语义）。
filter_zero_hop: false
