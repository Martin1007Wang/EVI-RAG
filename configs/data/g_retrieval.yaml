# configs/data/g_retrieval.yaml

_target_: src.datasets.g_retrieval_datamodule.GRetrievalDataModule

# Data contract metadata. This block is stripped before hydra instantiation.
contract:
  requires_dataset_cfg: true
  intended_entrypoints: [train, eval]
  expand_multi_answer: false
  retains_zero_hop: true
  embeddings_device_default: cpu

dataset_cfg: ${dataset}

# === Dataloader 逻辑参数 ===
batch_size: 16
num_workers: 16
drop_last: false
train_shuffle: true
# 如需缩短训练，优先使用 Trainer 的 `limit_train_batches` / `max_steps`。
prefetch_factor: 4
persistent_workers: true
precompute_edge_batch: true
# Node/question embedding tensors are prepared on CPU and moved with the batch.
embeddings_device: cpu
# 多答案由模型/奖励处理；DataLoader 不展开。
expand_multi_answer: false
# Zero-hop (q in A) 保留；需配合 stop_min_steps=1（真实步数语义）。
filter_zero_hop: false
