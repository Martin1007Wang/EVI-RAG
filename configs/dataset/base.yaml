# Shared dataset defaults for graph_retrieval.

name: ???
dataset_family: ???
dataset_scope: ???
# Total step budget (real edges only; super edges are internal).
max_steps: ???
hf_dataset: ???
dataset_source: hf
run_test_after_fit: false
train_split: train
val_split: validation
eval_split: test
predict_split: ${dataset.eval_split}
kb: freebase
stark: null

out_dir: ${paths.data_dir}/${dataset.dataset_family}/normalized
materialized_dir: ${paths.data_dir}/${dataset.dataset_family}/materialized
artifact_dir: ${paths.data_dir}/${dataset.dataset_family}/artifacts/${dataset.name}

paths:
  embeddings: ${dataset.materialized_dir}/embeddings
  entity_metadata: ${dataset.materialized_dir}/embeddings/entity_metadata.pt

lmdb_readahead: true
sequential_sample_ids: true

entity_normalization: none
entity_text_mode: regex
text_prefixes: []
text_regex: "^(?!m\\.|g\\.).*"
cvt_entity_mode: prefix_allowlist
cvt_prefixes: ["m.", "g."]
cvt_regex: null

column_map:
  question_id_field: id
  question_field: question
  answer_text_field: answer
  question_entity_field: q_entity
  answer_entity_field: a_entity
  graph_field: graph
