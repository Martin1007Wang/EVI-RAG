# configs/dataset/cwq-sub.yaml

defaults:
  - base
  - _self_

name: cwq-sub
dataset_scope: sub
dataset_family: cwq
max_steps: 4
hf_dataset: rmanluo/RoG-cwq

# Train LMDB (sub filter) has 21,103 samples; with batch_size=32 this is ~660 steps/epoch.
# Full validation is much heavier here, so validate roughly every ~3 train epochs.
val_check_interval: 2048


sample_filter_path: ${dataset.out_dir}/sub_filter.json
