# configs/dataset/webqsp.yaml

defaults:
  - base
  - _self_

name: webqsp
dataset_scope: full
dataset_family: webqsp
max_steps: 4
hf_dataset: rmanluo/RoG-webqsp

# Train LMDB has 2,826 samples with batch_size=16 (train_steps=177).
# Step-based validation interval tuned for cross-dataset parity.
val_check_interval: 512


filter_missing_answer:
  train: false
  validation: false
  test: false
