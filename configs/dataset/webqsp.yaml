# configs/dataset/webqsp.yaml

defaults:
  - base
  - _self_

name: webqsp
dataset_scope: full
dataset_family: webqsp
max_steps: 4
hf_dataset: rmanluo/RoG-webqsp

# Train LMDB has 2,826 samples; with batch_size=32 this is ~89 steps/epoch.
# Validate roughly every ~3 train epochs.
val_check_interval: 256


filter_missing_answer:
  train: false
  validation: false
  test: false
