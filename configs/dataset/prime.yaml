# configs/dataset/prime.yaml

defaults:
  - base
  - _self_

name: prime
dataset_scope: sub
dataset_family: stark_prime
max_steps: 4
hf_dataset: null
dataset_source: stark
kb: prime

stark:
  dataset: prime
  root: ${paths.data_dir}/stark
  download_processed: true
  indirected: false
  cache_dir: ${dataset.artifact_dir}/stark_cache
  linker:
    backend: vllm
    model: ${oc.env:STARK_VLLM_MODEL,""}
    tensor_parallel_size: 1
    max_model_len: null
    max_tokens: 192
    temperature: 0.0
    top_p: 1.0
    seed: null
    pretrim_to_budget: true
    budget_margin: 0
    max_candidates: 12
    max_entities: 4
  local_graph:
    num_hops: 2
    direction: both
    max_nodes: 64
    max_edges: 256
    include_inverse_edges: true
