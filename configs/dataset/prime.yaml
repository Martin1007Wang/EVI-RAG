# configs/dataset/prime.yaml

defaults:
  - base
  - _self_

name: prime
dataset_scope: sub
dataset_family: stark_prime
hf_dataset: null
dataset_source: stark
kb: prime

stark:
  dataset: prime
  root: ${paths.data_dir}/stark
  download_processed: true
  cache_dir: ${dataset.artifact_dir}/stark_cache
  linker:
    backend: keyword
    max_candidates: 12
    max_entities: 4
  local_graph:
    num_hops: 2
    direction: both
    max_nodes: 64
    max_edges: 256
