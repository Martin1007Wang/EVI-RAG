# configs/dataset/webqsp-sub.yaml

defaults:
  - base
  - _self_

name: webqsp-sub
dataset_scope: sub
dataset_family: webqsp
# Total step budget (real edges only; super edges are internal).
max_steps: 4
hf_dataset: rmanluo/RoG-webqsp

# Train LMDB (sub filter) has 2,607 samples with batch_size=16 (train_steps=163).
# Step-based validation interval tuned for cross-dataset parity.
val_check_interval: 512


sample_filter_path: ${dataset.out_dir}/sub_filter.json
