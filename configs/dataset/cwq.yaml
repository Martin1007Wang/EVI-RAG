# configs/dataset/cwq.yaml

defaults:
  - base
  - _self_

name: cwq
dataset_scope: full
dataset_family: cwq
max_steps: 4
hf_dataset: rmanluo/RoG-cwq

# Train LMDB has 27,631 samples with batch_size=16 (train_steps=1727).
# Step-based validation interval tuned for cross-dataset parity.
val_check_interval: 512


filter_missing_answer:
  train: false
  validation: false
  test: false

q_entity_blacklist:
  - Country
  - US State
  - College/University
  - UK constituent country
  - Film
  - Male
  - Marriage
  - United States Senator
  - United States Senate
