# Entrypoint contract for `python src/eval.py ...`
# - `/run` must be an eval-oriented run config (`run.name` cannot be `train_*`).
# - Dataset requirements are run-specific:
#   - `run=rankflow` requires `/dataset` and a checkpoint.
#   - `run=eval_llm` does not require `/dataset`, but it does require `/llm`.
# - Prefer `experiment=...` so `/run`, `/trainer`, and any task-specific groups move together.

defaults:
  - _self_
  - ckpt: default
  - run: default
  - dataset: null
  - data: graph_retrieval
  - model: gflownet
  - callbacks: default
  - logger: null
  - trainer: predict
  - paths: default
  - extras: default
  - hydra: default
  - experiment: null

task_name: ${run.task_name}
tags: ${run.tags}

# Seed for reproducibility; keep configurable via CLI override.
seed: 42

# Run-driven checkpoint (set explicitly in experiment configs).
ckpt_path: ${run.ckpt_path}
