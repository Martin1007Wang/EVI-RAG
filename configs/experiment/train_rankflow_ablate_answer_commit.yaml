# @package _global_
#
# Ablation: keep witness growth unchanged but remove wrong-answer / failure-stop
# penalties so answer commitment becomes much weaker.
# Usage:
#   python src/train.py experiment=train_rankflow_ablate_answer_commit dataset=webqsp-sub

defaults:
  - train_rankflow
  - _self_

run:
  name: train_rankflow_ablate_answer_commit
  task_name: "train/rankflow_ablate_answer_commit"
  tags: ["rankflow", "gflownet", "answer-commit", "ablation", "weak-stop"]

model:
  training_cfg:
    answer_reward:
      wrong_answer_penalty: 0.0
      failure_penalty: 0.0
