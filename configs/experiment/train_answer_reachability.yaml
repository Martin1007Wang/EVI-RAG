# @package _global_
#
# Backward-compatible alias for `experiment=train_rankflow`.
# Usage:
#   python src/train.py experiment=train_rankflow dataset=webqsp-sub
#
# Contract:
# - overrides `/run`, `/trainer`, `/model`, `/callbacks`, `/logger`
# - still requires the caller to choose `/dataset`

defaults:
  - override /callbacks: default
  - override /logger: wandb
  - override /run: train_rankflow
  - override /trainer: gpu
  - override /model: gflownet
  - _self_

optimized_metric: "val/sub/answer/recall@10"

data:
  # Keep the alias aligned with `train_rankflow` so the canonical webqsp-sub run
  # does not need per-session tmux overrides.
  batch_size: 192
  eval_batch_size: 32
  train_feature_dtype: bf16
  eval_feature_dtype: fp32
  train_max_graphs_per_batch: 192
  train_max_nodes_per_batch: 480000
  train_max_edges_per_batch: 1440000
  train_max_question_tokens_per_batch: 12288

fit_schedule:
  val_every_passes: 8.0
  early_stopping_patience_passes: 96.0

trainer:
  min_epochs: 0
  max_epochs: -1
  max_time: "00:08:00:00"
  check_val_every_n_epoch: null
  log_every_n_steps: 10
  precision: bf16-mixed
  gradient_clip_val: 0.5
  limit_val_batches: null

callbacks:
  model_checkpoint:
    monitor: "val/sub/answer/recall@10"
    mode: max
    filename: "step_{step:07d}"
    auto_insert_metric_name: False
    save_weights_only: True
  early_stopping:
    monitor: "val/sub/answer/recall@10"
    mode: max
    # Runtime rewrites this from `fit_schedule.early_stopping_patience_passes`.
    patience: 12
    min_delta: 0.002

model:
  policy_cfg:
    candidate_shortlist:
      enabled: true
      topk: 16
      degree_threshold: 32
      heuristic_weight: 1.0
  training_cfg:
    guidance:
      loss_weight: 0.0
      detach_features: true
    shortest_path_reward:
      weight: 0.75
      schedule_type: constant
      completion_power: 2.0
  heuristic_cfg:
    kind: none
    beta: 0.0
  eval_cfg:
    # Training-time validation only needs answer-ranking metrics; full window search is reserved for final eval.
    strict_search: true
    metrics_profile: rank_only
    monte_carlo_rollouts: 256
    max_expansions: 100000
    max_frontier_size: 32768
  scheduler_cfg:
    type: cosine
    interval: step
    t_max: ${trainer.max_steps}
    eta_min: 1.0e-6
  optimizer_cfg:
    lr: 5.0e-5
    weight_decay: 1.0e-4
