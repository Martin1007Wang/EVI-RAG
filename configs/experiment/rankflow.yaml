# @package _global_
#
# Evaluate an answer-committed RankFlow checkpoint on test split (full + sub).
# Usage:
#   python src/eval.py experiment=rankflow ckpt.gflownet=/path/to/model.ckpt
#
# Contract:
# - overrides `/run`, `/dataset`, `/data`, `/model`, `/trainer`
# - the `/dataset` override chooses the dataset family root; `/run.dataset_variants`
#   then expands it into `full + sub`

defaults:
  - override /run: rankflow
  - override /dataset: webqsp
  - override /data: graph_retrieval
  - override /model: gflownet
  - override /callbacks: eval
  - override /logger: none
  - override /trainer: predict
  - _self_

model:
  eval_cfg:
    report_profile: full
    # Final eval uses the same canonical answer-committed Monte Carlo posterior as
    # checkpoint selection, but emits the full support-window report surface.
