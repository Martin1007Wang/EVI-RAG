# @package _global_

defaults:
  - override /dataset: webqsp
  - override /model: weaver
  - override /trainer: gpu
  - override /callbacks: train
  - override /logger: wandb
  - _self_

task_name: train_webqsp

logger:
  tags: [weaver, detailed_balance, webqsp]

trainer:
  max_epochs: 10000
  max_steps: -1
  val_check_interval: null
  check_val_every_n_epoch: 1

model:
  runner:
    replay_source:
      threshold: 0.8

callbacks:
  early_stopping:
    patience: 20
