# @package _global_
#
# Overfit probe on validation samples whose shortest reachable answer path needs
# at least 2 hops.
#
# Usage:
#   python scripts/build_hop_filter.py --dataset webqsp-sub --split validation --min-hop 2
#   python src/train.py experiment=train_rankflow_overfit_valhop2 dataset=webqsp-sub

defaults:
  - train_rankflow
  - _self_

run:
  test: false

data:
  # Train and validate on the same validation subset so we can see whether the
  # current Detailed Balance objective can memorize multi-hop bridge behavior at all.
  splits:
    train: validation
    validation: validation
    test: validation
  batch_size: 8
  eval_batch_size: 8
  num_workers: 0
  eval_num_workers: 0
  persistent_workers: false
  eval_persistent_workers: false
  multiprocessing_context: null
  eval_multiprocessing_context: null
  train_shuffle: false

dataset:
  sample_filter_paths:
    validation:
      - ${dataset.out_dir}/validation_hop_ge_2.json
  # Keep the subset intentionally tiny so a memorization failure is obvious.
  sample_limit:
    validation: 32

fit_schedule:
  max_passes: 128.0
  val_every_passes: 2.0
  early_stopping_patience_passes: 64.0

trainer:
  log_every_n_steps: 1
  max_time: "00:00:20:00"

model:
  eval_cfg:
    monte_carlo:
      rollouts: 32
      batch_rollouts: 32
