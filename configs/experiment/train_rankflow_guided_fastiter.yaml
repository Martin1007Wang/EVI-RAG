# @package _global_
#
# Fast-iteration bundle for the reference-path replay ablation.

defaults:
  - train_rankflow_guided
  - train_rankflow_fastiter
  - _self_

run:
  name: train_rankflow_guided_fastiter
  task_name: "train/rankflow_guided_fastiter"
  tags: ["rankflow", "gflownet", "guided", "replay", "ablation", "fastiter"]

model:
  training_cfg:
    auxiliary:
      replay:
        buffer:
          replay_trajectories_per_step: 16
