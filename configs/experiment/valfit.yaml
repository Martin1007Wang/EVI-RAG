# @package _global_

defaults:
  - override /dataset: webqsp
  - override /model: weaver
  - override /trainer: gpu
  - override /callbacks: train
  - override /logger: wandb
  - _self_

task_name: valfit
test_after_fit: true

datamodule:
  splits:
    train: validation
    validation: validation
    test: test

trainer:
  max_epochs: 5000
  max_steps: -1
  val_check_interval: null
  check_val_every_n_epoch: 1

      
logger:
  tags: [weaver, detailed_balance, valfit, webqsp]
