# @package _global_
#
# Forward-only DualFlow (SubTB, deterministic backward policy).

defaults:
  - override /callbacks: default
  - override /logger: wandb
  - override /trainer: gpu
  - _self_

task_name: "train/dual_flow"
tags: ["dual_flow", "subtb", "forward"]

optimized_metric: "val/sub/hit@beam"

trainer:
  # Keep max_epochs as a hard ceiling in trainer/default.yaml; enforce wall-clock budget here.
  max_time: "00:08:00:00"
  # Align optimizer schedule with an 8h CWQ-sub budget (~55k steps observed).
  max_steps: 56000
  check_val_every_n_epoch: 5
  precision: bf16-mixed
  gradient_clip_val: 0.5

callbacks:
  model_checkpoint:
    monitor: "val/sub/hit@beam"
    mode: max
    filename: "epoch_{epoch:03d}"
    auto_insert_metric_name: False
    save_weights_only: True
  early_stopping:
    monitor: "val/sub/hit@beam"
    mode: max
    patience: 10
    min_delta: 0.002

model:
  env_cfg:
    stop:
      reward_epsilon: 1.0e-5
      distance_reward_gamma: 0.8
      reward_beta_init: 0.6
      reward_beta_max: 1.0
      reward_beta_anneal_steps: 12000
      reward_beta_anneal_start_step: 1000
      reward_beta_schedule: linear
    prior:
      pb_mode: uniform_in_degree

  sampling_cfg:
    num_rollouts: 4
    stop_min_steps: 1
    train_oracle_force_stop: false
    sampling_temperature: 1.0

  eval_cfg:
    beam_size: 8

  subtb_cfg:
    lambda_weight: 0.8
    normalize: true
    detach_end_flow: true
    miss_length_penalty: 0.0
    ranking_weight: 0.0
    ranking_temperature: 1.0
    backward_weight: 0.3

  optimizer_cfg:
    lr: 5.0e-5
    weight_decay: 1.0e-4

  scheduler_cfg:
    type: cosine
    interval: step
    t_max: ${trainer.max_steps}
    eta_min: 1.0e-6
