# @package _global_
#
# Evaluate DualFlow checkpoint on test split (full + sub) with one command.
# Usage:
#   python src/eval.py experiment=eval_dual_flow ckpt.dual_flow=/path/to/dual_flow.ckpt

defaults:
  - override /run: eval_dual_flow
  - override /dataset: webqsp
  - override /data: g_retrieval
  - override /model: dual_flow
  - override /callbacks: dual_flow_eval
  - override /logger: none
  - override /trainer: predict
  - _self_

