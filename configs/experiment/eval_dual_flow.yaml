# @package _global_
#
# Experiment: DualFlow evaluation (predict + metrics + rollouts).

defaults:
  - override /callbacks: dual_flow_eval
  - override /logger: none
  - override /run: eval_dual_flow
  - override /trainer: predict

ckpt:
  dual_flow: ${oc.env:DUAL_FLOW_CKPT,null}

callbacks:
  dual_flow_rollout_artifact_writer:
    textualize: true

data:
  splits:
    test: ${run.split}

model:
  evaluation_cfg:
    beam_size: 100
