# @package _global_
#
# Experiment: SubgraphRAG-aligned LLM reasoning over support windows.
# Usage:
#   python src/eval.py experiment=eval_llm llm.input_path=/path/to/test.jsonl
#
# Notes:
# - overrides `/run`, `/trainer`, `/logger`, `/callbacks`
# - does not require `/dataset`
# - does require `/llm`, typically supplied entirely by this experiment bundle

defaults:
  - override /callbacks: eval
  - override /logger: none
  - override /run: eval_llm
  - override /trainer: predict
  - _self_

llm:
  providers: [vllm]
  allow_sub: false
  input_path: null
  # Optional gold-label sidecar. Defaults to "<input_path stem>.labels.jsonl" when present.
  input_labels_path: null
  output_dir: null
  input_subdir: rankflow
  # Separate outputs by retrieval source (e.g., rankflow).
  output_subdir: eval_llm/${llm.input_subdir}
  output_filename_template: "{split}_k{k}_{provider}.jsonl"
  compute_metrics: true
  metrics_filename_template: "{split}_k{k}_{provider}.metrics.json"
  metrics_log_dir: ${paths.output_dir}/metrics
  metrics_jsonl_name: llm.jsonl
  topk_list: [1, 10, 25, 50, 100]
  max_samples: null
  batch_size: 8
  resume: true
  output:
    include_question: true
    include_trajectories: true
    include_messages: false
    include_raw_response: true
    debug_only_on_empty: false
  schema:
    # Disabled: SubgraphRAG-style prompts do not return JSON.
    enabled: false
    max_retries: 0
    allow_coerce: true
    max_retry_chars: 2000
  prompt:
    # SubgraphRAG-style: ICL + double-check retry, expects "ans:" lines.
    mode: subgraphrag_icl_dc
    # Use built-in SubgraphRAG ICL prompts when null.
    system: null
    cot_prompt: null
    icl_user_prompt: null
    icl_assistant_prompt: null
    answer_key: "answer"
    answer_separator: " | "
    allow_empty: false
    constrain_to_candidates: true
    # Candidate construction strategy:
    # - endpoints_only: only trajectory endpoint nodes
    # - trajectory_nodes: all nodes touched by trajectories (higher oracle coverage)
    candidate_source: trajectory_nodes
    max_prompt_chars: 32000
    # Retrieval window size. This is the number of trajectory records surfaced to the LLM.
    max_trajectories: 100
    max_candidates: 100
  vllm:
    model: Qwen/Qwen2.5-7B-Instruct
    tensor_parallel_size: 1
    max_model_len: 8192
    seed: 42
    pretrim_to_budget: true
    budget_margin: 64
    temperature: 0.0
    top_p: 1.0
    max_tokens: 512
  openai:
    model: gpt-4o
    temperature: 0.0
    max_tokens: 256
    timeout_sec: 120
    max_retries: 5
    backoff_seconds: 5
    backoff_base: 2
    # API options (OpenAI-compatible)
    # base_url: https://api.openai.com/v1
    # api_key_env: OPENAI_API_KEY
    # require_api_key: true
    # chat_completions_path: /chat/completions
