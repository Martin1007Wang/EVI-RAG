# @package _global_

defaults:
  - override /callbacks: default
  - override /logger: wandb
  - override /trainer: gpu
  - override /model: trajectory_gfn
  - _self_

task_name: "train/trajectory_gfn"
tags: ["trajectory_gfn", "trajectory", "gflownet"]

optimized_metric: "val/sub/covered_gold_mass@90"

trainer:
  max_time: "00:08:00:00"
  max_steps: 56000
  check_val_every_n_epoch: null
  val_check_interval: ${dataset.val_check_interval}
  log_every_n_steps: 32
  precision: bf16-mixed
  gradient_clip_val: 0.5
  limit_val_batches: 64

callbacks:
  model_checkpoint:
    monitor: "val/sub/covered_gold_mass@90"
    mode: max
    filename: "epoch_{epoch:03d}"
    auto_insert_metric_name: False
    save_weights_only: True
  early_stopping:
    monitor: "val/sub/covered_gold_mass@90"
    mode: max
    patience: 10
    min_delta: 0.002

model:
  inference_cfg:
    mode: sampled
    compute_support_windows: true
    max_rollouts: 64
    rollout_chunk_size: 16
  scheduler_cfg:
    type: cosine
    interval: step
    t_max: ${trainer.max_steps}
    eta_min: 1.0e-6
  optimizer_cfg:
    lr: 5.0e-5
    weight_decay: 1.0e-4
