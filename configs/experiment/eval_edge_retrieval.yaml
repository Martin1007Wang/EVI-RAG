# @package _global_
#
# Evaluate a RankFlow checkpoint with edge-retrieval metrics.
# Usage:
#   python src/eval.py experiment=eval_edge_retrieval ckpt.gflownet=/path/to/model.ckpt
#
# Contract:
# - inherits the RankFlow eval runner and dataset family expansion
# - only changes the inference view/profile and artifact naming

defaults:
  - override /run: rankflow
  - override /dataset: webqsp
  - override /data: graph_retrieval
  - override /model: gflownet
  - override /callbacks: eval
  - override /logger: none
  - override /trainer: predict
  - _self_

model:
  metric_runtime_factory:
    _target_: src.metrics.answer_reachability.runtime.SearchMetricRuntimeFactory
  heuristic_cfg:
    kind: topology
    beta: 1.0
  eval_cfg:
    _target_: src.models.configs.gflownet.SearchEvalConfig
    task: edge_retrieval
    metrics_profile: rank_only
    support_search_method: monte_carlo
    edge_top_ks: [1, 5, 10, 25, 50]
    edge_emit_top_k: 25

run:
  artifact_subdir: eval_edge_retrieval
  artifact_name: eval_edge_retrieval
  tags: [eval, edge_retrieval]
