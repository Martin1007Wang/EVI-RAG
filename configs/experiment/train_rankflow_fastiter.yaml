# @package _global_
#
# Fast-iteration RankFlow training bundle for quick idea validation.
# Usage:
#   python src/train.py experiment=train_rankflow_fastiter dataset=webqsp-sub
#
# Contract:
# - keeps the RankFlow train path but makes validation/test intentionally cheap
# - disables post-fit heavy eval and replay-driven training extras by default

defaults:
  - train_rankflow
  - _self_

data:
  eval_batch_size: 64

run:
  # Tuning runs should stop after fit; final eval remains available from the
  # full `train_rankflow` experiment or a dedicated eval command.
  test: false

fit_schedule:
  max_passes: 48.0
  early_stopping_patience_passes: 16.0

trainer:
  max_time: "00:02:00:00"

model:
  eval_cfg:
    # Fast-iteration validation only needs a coarser Monte Carlo trend estimate.
    monte_carlo_rollouts: 128
