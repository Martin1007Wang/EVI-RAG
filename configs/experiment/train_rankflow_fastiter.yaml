# @package _global_
#
# Fast-iteration RankFlow training bundle for quick idea validation.
# Usage:
#   python src/train.py experiment=train_rankflow_fastiter dataset=webqsp-sub
#
# Contract:
# - keeps the RankFlow train path but makes validation/test intentionally cheap
# - disables post-fit heavy eval and replay-driven training extras by default

defaults:
  - override /callbacks: default
  - override /logger: wandb
  - override /run: train_rankflow
  - override /trainer: gpu
  - override /model: gflownet
  - _self_

optimized_metric: "val/sub/answer/recall@10"

data:
  eval_batch_size: 64

run:
  # Tuning runs should stop after fit; final eval remains available from the
  # full `train_rankflow` experiment or a dedicated eval command.
  test: false

fit_schedule:
  max_passes: 48.0
  val_every_passes: 8.0
  early_stopping_patience_passes: 16.0

trainer:
  min_epochs: 0
  max_epochs: -1
  max_time: "00:02:00:00"
  check_val_every_n_epoch: null
  log_every_n_steps: 50
  precision: bf16-mixed
  gradient_clip_val: 0.5
  limit_val_batches: null

callbacks:
  model_checkpoint:
    monitor: "val/sub/answer/recall@10"
    mode: max
    filename: "step_{step:07d}"
    auto_insert_metric_name: False
    save_weights_only: True
  early_stopping:
    monitor: "val/sub/answer/recall@10"
    mode: max
    patience: 2
    min_delta: 0.002

model:
  policy_cfg:
    candidate_shortlist:
      enabled: true
      topk: 16
      degree_threshold: 32
      heuristic_weight: 1.0
  training_cfg:
    success_replay:
      enabled: false
    adaptive_sampling:
      enabled: false
  heuristic_cfg:
    kind: none
    beta: 0.0
  eval_cfg:
    # Fast-iteration validation only needs a coarse trend estimate.
    strict_search: true
    metrics_profile: rank_only
    monte_carlo_rollouts: 128
    max_expansions: 100000
    max_frontier_size: 32768
  scheduler_cfg:
    type: cosine
    interval: step
    t_max: ${trainer.max_steps}
    eta_min: 1.0e-6
  optimizer_cfg:
    lr: 5.0e-5
    weight_decay: 1.0e-4
