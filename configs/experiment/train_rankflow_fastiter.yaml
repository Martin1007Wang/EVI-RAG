# @package _global_
#
# Fast-iteration answer-committed RankFlow bundle for quick idea validation.
# Usage:
#   python src/train.py experiment=train_rankflow_fastiter dataset=webqsp-sub
#
# Contract:
# - keeps the RankFlow train path but makes validation/test intentionally cheap
# - disables post-fit heavy eval and keeps the canonical answer-commit objective

defaults:
  - train_rankflow
  - _self_

data:
  # The structured backbone makes eval preparation heavier too; keep the fast
  # path visibly cheaper than full train without reintroducing avoidable OOMs.
  eval_batch_size: 16

run:
  # Tuning runs should stop after fit; final eval remains available from the
  # full `train_rankflow` experiment or a dedicated eval command.
  test: false

fit_schedule:
  max_passes: 48.0
  early_stopping_patience_passes: 16.0

trainer:
  max_time: "00:02:00:00"

model:
  eval_cfg:
    # Fast iteration keeps the same answer-committed Monte Carlo posterior
    # semantics as the canonical train/eval path, but trims the rollout budget.
    monte_carlo:
      rollouts: 256
      batch_rollouts: 256
