# @package _global_

defaults:
  - train_rankflow_valfit
  - override /logger: none
  - override /trainer: cpu
  - _self_

variant: single_sample_debug

# Restrict every split to one real validation sample so breakpoints stay on a
# stable example across fit/val/test.
dataset:
  sample_filter_path: ${paths.root_dir}/configs/experiment/webqsp_single_sample_debug.json
  filter_files:
    validation:
      - ${dataset.out_dir}/sub_filter.json

data:
  batch_size: 1
  eval_batch_size: 1
  num_workers: 0
  eval_num_workers: 0
  pin_memory: false
  train_shuffle: false
  max_graphs_per_batch: 1

trainer:
  max_steps: 1
  limit_train_batches: 1
  limit_val_batches: 1
  limit_test_batches: 1
  num_sanity_val_steps: 0
  val_check_interval: 1
  log_every_n_steps: 1
  deterministic: true
