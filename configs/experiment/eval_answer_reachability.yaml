# @package _global_
#
# Evaluate an answer-reachability checkpoint on test split (full + sub) with one command.
# Usage:
#   python src/eval.py experiment=eval_answer_reachability ckpt.answer_reachability=/path/to/model.ckpt
#
# Contract:
# - overrides `/run`, `/dataset`, `/data`, `/model`, `/trainer`
# - the `/dataset` override chooses the dataset family root; `/run.dataset_variants`
#   then expands it into `full + sub`

defaults:
  - override /run: eval_answer_reachability
  - override /dataset: webqsp
  - override /data: g_retrieval
  - override /model: gflownet
  - override /callbacks: default
  - override /logger: none
  - override /trainer: predict
  - _self_

model:
  heuristic_cfg:
    kind: topology
    beta: 1.0
  inference_cfg:
    # Final eval uses the full support-window search budget.
    max_expansions: 500000
    max_frontier_size: 65536
