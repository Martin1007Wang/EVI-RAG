# @package _global_
#
# Ablation: remove the answer-in-graph utility bonus while keeping the witness
# growth objective otherwise unchanged.
# Usage:
#   python src/train.py experiment=train_rankflow_ablate_answer_utility dataset=webqsp-sub

defaults:
  - train_rankflow
  - _self_

run:
  name: train_rankflow_ablate_answer_utility
  task_name: "train/rankflow_ablate_answer_utility"
  tags: ["rankflow", "gflownet", "ablation", "no-answer-utility"]

model:
  training_cfg:
    answer_reward:
      hit_bonus: 0.0
      frontier_bonus: 0.0
