# @package _global_
#
# Residual GFlowNet (learned residual + preferential attachment prior).

defaults:
  - train_dual_flow_base
  - _self_

task_name: "train/dual_flow/p0_preferential"
tags: ["dual_flow", "p0_preferential"]

model:
  runtime_cfg:
    p0_cfg:
      mode: preferential
      residual_enabled: true
      temperature: 1.0
      cosine_eps: 1.0e-6
