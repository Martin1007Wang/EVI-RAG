# @package _global_
#
# Shared DualFlow training defaults.

defaults:
  - override /callbacks: default
  - override /logger: wandb
  - override /trainer: gpu
  - _self_

optimized_metric: "val/${dataset.dataset_scope}/hit@beam"

trainer:
  check_val_every_n_epoch: 5
  precision: 32

model:
  scheduler_cfg:
    type: onecycle
    interval: step
    max_lr: ${model.optimizer_cfg.lr}
    cycle_momentum: false
    pct_start: 0.2

  training_cfg:
    accumulate_grad_batches: 4

callbacks:
  model_checkpoint:
    monitor: "val/${dataset.dataset_scope}/hit@beam"
    mode: max
    filename: "epoch_{epoch:03d}"
    auto_insert_metric_name: False
    save_weights_only: True
  early_stopping:
    monitor: "val/${dataset.dataset_scope}/hit@beam"
    mode: max
    patience: 50
