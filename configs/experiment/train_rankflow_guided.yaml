# @package _global_
#
# Ablation: enable reference-path replay on top of the paper-aligned RankFlow mainline.
# Usage:
#   python src/train.py experiment=train_rankflow_guided dataset=webqsp-sub
#
# Use this only as an auxiliary ablation when comparing against the plain
# Detailed-Balance training objective.

defaults:
  - train_rankflow
  - _self_

run:
  name: train_rankflow_guided
  task_name: "train/rankflow_guided"
  tags: ["rankflow", "gflownet", "guided", "replay", "ablation"]

model:
  training_cfg:
    auxiliary:
      replay:
        enabled: true
        mix_alpha: 0.25
        buffer:
          min_buffer_size: 32
          replay_trajectories_per_step: 32
        guidance:
          add_shortest_path_guidance: true
          expand_imitation_weight: 0.10
          expand_imitation_from_anchor_bonus: 0.25
          expand_imitation_answer_finish_bonus: 0.50
          mask_stop_loss: true
