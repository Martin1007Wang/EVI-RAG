# @package _global_

defaults:
  - override /dataset: webqsp
  - override /model: weaver
  - override /trainer: gpu
  - override /callbacks: train
  - override /logger: wandb
  - _self_

task_name: debug_valfit

# Validation rollout probe:
# train/validation/test all point at the validation split so
# val/main/* should improve if optimization is healthy.
trainer:
  max_epochs: -1
  max_steps: 10000
  check_val_every_n_epoch: 1

datamodule:
  splits:
    train: validation
    validation: validation
    test: validation

model:
  runner:
    replay_schedule: null
