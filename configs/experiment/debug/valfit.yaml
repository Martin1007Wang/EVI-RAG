# @package _global_

defaults:
  - override /dataset: webqsp
  - override /model: weaver
  - override /trainer: gpu
  - override /callbacks: train
  - override /logger: wandb
  - _self_

task_name: debug_valfit

trainer:
  max_epochs: 10000
  max_steps: -1
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  devices: 1

datamodule:
  splits:
    train: validation
    validation: validation
    test: validation

  batch_size: 4
  eval_batch_size: 4

  num_workers: 0
  eval_num_workers: 0
  train_shuffle: false