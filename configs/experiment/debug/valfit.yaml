# @package _global_

defaults:
  - override /dataset: webqsp
  - override /model: weaver
  - override /trainer: gpu
  - override /callbacks: train
  - override /logger: wandb
  - override /profiler: none
  - _self_

task_name: debug_valfit

trainer:
  max_epochs: 1000
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  devices: 1

datamodule:
  splits:
    train: validation
    validation: validation
    test: validation