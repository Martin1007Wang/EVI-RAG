# @package _global_

defaults:
  - /experiment/debug/valfit
  - _self_

task_name: valfit_degrade_reward_loose
experiment_name: valfit_degrade_reward_loose

tags:
  - valfit_degrade
  - reward
  - lower_compactness

notes: >
  Weakens the stop-favoring reward shape by lowering edge cost and fail cost.
  Tests whether late regression is driven by the reward preferring hit-then-stop
  over continued evidence expansion.

logger:
  name: ${experiment_name}-${dataset.name}-${now:%Y%m%d-%H%M%S}
  group: valfit_degrade
  tags: ${tags}

model:
  reward_model:
    edge_cost: 0.05
    fail_cost: 3.0
