# @package _global_

defaults:
  - /experiment/debug/valfit
  - _self_

task_name: valfit_degrade_replay_more
experiment_name: valfit_degrade_replay_more

tags:
  - valfit_degrade
  - replay
  - more_positive_edges

notes: >
  Increases replay coverage to test whether late regression is partly caused by
  insufficient continue-expansion supervision after the first answer hit.

logger:
  name: ${experiment_name}-${dataset.name}-${now:%Y%m%d-%H%M%S}
  group: valfit_degrade
  tags: ${tags}

model:
  runner:
    replay_source:
      top_k_per_state: 4
      max_transitions_per_graph: 256
