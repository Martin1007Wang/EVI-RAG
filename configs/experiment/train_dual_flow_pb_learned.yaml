# @package _global_
#
# DualFlow training: PB-learned (learnable backward policy).

defaults:
  - override /model/db: learned
  - override /callbacks: default
  - override /logger: wandb
  - override /trainer: gpu

task_name: "train/dual_flow/pb_learned"
tags: ["dual_flow", "pb_learned"]
optimized_metric: "val/hit@beam"

trainer:
  check_val_every_n_epoch: 5
  precision: 32

model:
  scheduler_cfg:
    type: onecycle
    interval: step
    max_lr: ${model.optimizer_cfg.lr}
    cycle_momentum: false
    pct_start: 0.2

  training_cfg:
    accumulate_grad_batches: 4

callbacks:
  model_checkpoint:
    monitor: val/hit@beam
    mode: max
    filename: "epoch_{epoch:03d}"
    auto_insert_metric_name: False
    save_weights_only: True
  early_stopping:
    monitor: val/hit@beam
    mode: max
    patience: 50
