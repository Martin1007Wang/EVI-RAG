# @package _global_
#
# Export edge retriever top-K triples as 1-hop rollouts for LLM eval.

defaults:
  - override /run: eval_edge_retriever
  - override /data: g_retrieval_edge_retriever_eval
  - override /model: edge_retriever
  - override /callbacks: edge_retriever_eval
  - override /logger: none
  - override /trainer: predict
  - _self_

# Make LLM eval meaningful: expose entity/relation surface forms, matching eval_dual_flow.
callbacks:
  edge_retriever_rollout_writer:
    textualize: true
