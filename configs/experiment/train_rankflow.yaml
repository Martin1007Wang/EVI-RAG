# @package _global_
#
# Canonical paper-aligned RankFlow training bundle for evidence-subgraph generation.
# Usage:
#   python src/train.py experiment=train_rankflow dataset=webqsp-sub
#
# Notes:
# - overrides `/run`, `/trainer`, `/model`, `/callbacks`, `/logger`
# - still requires the caller to choose `/dataset`

defaults:
  - override /callbacks: default
  - override /logger: wandb
  - override /run: train_rankflow
  - override /trainer: gpu
  - override /model: gflownet
  - _self_

optimized_metric: "val/sub/answer/recall@10"

data:
  # The structured backbone now performs real sparse graph propagation during
  # batch preparation, so the previous 64x32 train-time rollout surface no
  # longer fits on a 48 GiB A6000. Keep the graph batch modest and recover a
  # larger effective batch with gradient accumulation instead of raw VRAM.
  batch_size: 8
  eval_batch_size: 8

fit_schedule:
  # With large batches, validation every 2 passes becomes too chatty. Keep the
  # pass-based semantics but space checks out so the train loop does more useful
  # optimizer work between validations.
  val_every_passes: 8.0
  early_stopping_patience_passes: 96.0

trainer:
  max_time: "00:08:00:00"
  # Accumulate gradients to preserve a stable optimizer batch without bringing
  # back the full in-memory rollout surface.
  accumulate_grad_batches: 8
  # Smaller per-step batches make progress harder to read if logging stays too
  # sparse, so tighten the logging cadence slightly.
  log_every_n_steps: 16
  gradient_clip_val: 0.5

callbacks:
  model_checkpoint:
    monitor: ${optimized_metric}
    save_weights_only: True
  early_stopping:
    monitor: ${optimized_metric}
    min_delta: 0.002

model:
  policy_cfg:
    state_mode: subgraph
  training_cfg:
    rollouts_per_graph: 16
  eval_cfg:
    # Keep training-time checkpoint selection on the same Monte Carlo answer
    # posterior that final eval uses; only the report surface stays rank-only.
    report_profile: rank_only
  optimizer_cfg:
    lr: 5.0e-5

run:
  # Use the explicit eval alias so post-fit testing points at a dedicated
  # experiment bundle instead of the more generic legacy name.
  final_eval_experiment: eval_rankflow
