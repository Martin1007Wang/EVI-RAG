# @package _global_
#
# Canonical RankFlow training bundle for answer ranking.
# Usage:
#   python src/train.py experiment=train_rankflow dataset=webqsp-sub
#
# Contract:
# - overrides `/run`, `/trainer`, `/model`, `/callbacks`, `/logger`
# - still requires the caller to choose `/dataset`

defaults:
  - override /callbacks: default
  - override /logger: wandb
  - override /run: train_rankflow
  - override /trainer: gpu
  - override /model: gflownet
  - _self_

optimized_metric: "val/sub/answer/recall@10"

data:
  batch_size: 256
  eval_batch_size: 32

fit_schedule:
  # With large batches, validation every 2 passes becomes too chatty. Keep the
  # pass-based semantics but space checks out so the train loop does more useful
  # optimizer work between validations.
  val_every_passes: 8.0
  early_stopping_patience_passes: 96.0

trainer:
  max_time: "00:08:00:00"
  # WebQSP-sub sees >1 full train pass by step 32 at batch 256, which keeps
  # train metrics closer to dataset-level trends than per-mini-batch noise.
  log_every_n_steps: 32
  gradient_clip_val: 0.5

callbacks:
  model_checkpoint:
    monitor: ${optimized_metric}
    save_weights_only: True
  early_stopping:
    monitor: ${optimized_metric}
    min_delta: 0.002

model:
  action_prior_cfg:
    kind: hybrid
    beta: 0.75
    node_topology_weight: 1.0
    node_embedding_weight: 0.5
    relation_embedding_weight: 1.0
    target_node_weight: 0.5
    progress_weight: 1.0
    stop_beta: 0.0
  eval_cfg:
    # Training-time validation only needs cheap Monte Carlo answer-ranking estimates;
    # full flow-frontier search is reserved for final eval.
    strict_search: true
    metrics_profile: rank_only
    support_search_method: monte_carlo
    monte_carlo_rollouts: 256
  optimizer_cfg:
    lr: 5.0e-5
