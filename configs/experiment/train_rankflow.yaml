# @package _global_
#
# Canonical RankFlow training bundle for answer ranking.
# Usage:
#   python src/train.py experiment=train_rankflow dataset=webqsp-sub
#
# Contract:
# - overrides `/run`, `/trainer`, `/model`, `/callbacks`, `/logger`
# - still requires the caller to choose `/dataset`

defaults:
  - override /callbacks: default
  - override /logger: wandb
  - override /run: train_rankflow
  - override /trainer: gpu
  - override /model: gflownet
  - _self_

optimized_metric: "val/sub/answer/recall@10"

data:
  # Raise rollouts per graph aggressively, then shrink the number of graphs per
  # optimizer step so per-step memory stays in a workable range.
  batch_size: 64
  eval_batch_size: 32

fit_schedule:
  # With large batches, validation every 2 passes becomes too chatty. Keep the
  # pass-based semantics but space checks out so the train loop does more useful
  # optimizer work between validations.
  val_every_passes: 8.0
  early_stopping_patience_passes: 96.0

trainer:
  max_time: "00:08:00:00"
  # Even after shrinking the graph batch for higher rollout density, logging
  # every 32 steps still lands often enough to show sub-pass training movement.
  log_every_n_steps: 32
  gradient_clip_val: 0.5

callbacks:
  model_checkpoint:
    monitor: ${optimized_metric}
    save_weights_only: True
  early_stopping:
    monitor: ${optimized_metric}
    min_delta: 0.002

model:
  action_prior_cfg:
    root_beta: 1.0
    edge_beta: 0.75
    node_embedding_weight: 0.25
    relation_embedding_weight: 0.75
    target_node_weight: 0.0
    progress_weight: 0.0
    shortest_path_edge_weight: 1.0
    answer_distance_weight: 0.5
  policy_cfg:
    state_mode: subgraph
    transition_head:
      enabled: false
  training_cfg:
    rollouts_per_graph: 32
    potential_reward:
      answer_distance_weight: 0.0
    subgraph_proposal:
      oracle_answer_distance_weight: 0.5
      prior_question_similarity_weight: 0.75
      prior_component_merge_weight: 1.0
      stop_hit_bias: 0.25
    action_prior_schedule:
      # Start with stronger subgraph proposal bias, then anneal it away so the
      # late-stage rollout policy realigns with the target policy.
      type: cosine
      initial_scale: 0.8
      final_scale: 0.0
      hold_steps: 1000
    transition_bias_schedule:
      type: cosine
      final_scale: 0.0
      hold_steps: 1000
    success_replay:
      mix_alpha: 0.0
      capacity: 512
      replay_trajectories_per_step: 64
      add_shortest_path_guidance: false
    replay_mix_schedule:
      type: cosine
      final_alpha: 0.0
      hold_steps: 2000
  eval_cfg:
    # Keep training-time checkpoint selection on the same flow-frontier answer
    # posterior that final eval uses; only the report surface stays rank-only.
    report_profile: rank_only
    answer_posterior_backend: flow_frontier
    flow_frontier:
      max_expansions: 500000
      max_frontier_size: 65536
  optimizer_cfg:
    lr: 5.0e-5
