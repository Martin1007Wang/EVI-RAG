# Entrypoint rules for `python src/debug_single_graph_fit.py ...`

defaults:
  - _self_
  - dataset: null
  - data: datamodule
  - model: gflownet
  - paths: default
  - hydra: default

task_name: debug_single_graph_fit
seed: 42

split: ${dataset.val_split}
dataset_index: 0

device: auto
path_mode: qa_directed
expand_budget: ${model.expand_budget}

overfit_steps: 60
eval_every: 10
overfit_temperature: 1.0
overfit_lr: ${model.optimizer_cfg.lr}
overfit_weight_decay: ${model.optimizer_cfg.weight_decay}
