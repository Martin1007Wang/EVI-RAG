# Canonical RankFlow eval run.
# Use with `python src/eval.py ...`; requires `/dataset` and `ckpt.gflownet`.
# The default `dataset_variants` expand one dataset family root (for example
# `webqsp`) into the paired `full + sub` evaluation passes.
defaults:
  - default
  - _self_

name: rankflow
task_name: "eval/rankflow"
tags: ["eval", "rankflow"]
ckpt_path: ${ckpt.gflownet}
write_artifacts: true
artifact_subdir: rankflow
artifact_overwrite: true
dataset_variants:
  # Optional rich form per variant:
  # - label: full_eval
  #   dataset: webqsp
  #   dataset_overrides:
  #     artifact_dir: /tmp/custom-artifacts
  #   run_overrides:
  #     split: validation
  #   overrides:
  #     - dataset.out_dir=/tmp/custom-normalized
  - ${dataset.dataset_family}
  - ${dataset.dataset_family}-sub
