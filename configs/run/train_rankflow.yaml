# Canonical RankFlow training run.
# Use with `python src/train.py ...`; requires a `-sub` dataset and is
# usually selected via `experiment=train_rankflow dataset=webqsp-sub`.
defaults:
  - train_default
  - _self_

name: train_rankflow
task_name: "train/rankflow"
tags: ["rankflow", "gflownet", "detailed-balance"]
test: true
final_eval_experiment: eval_rankflow
final_eval_split: test
final_eval_output_subdir: final_eval
