# Canonical RankFlow training run.
# Contract: use with `python src/train.py ...`; requires a `-sub` dataset and is
# usually selected via `experiment=train_rankflow dataset=webqsp-sub`.
defaults:
  - train_default
  - _self_

name: train_rankflow
task_name: "train/rankflow"
tags: ["rankflow", "gflownet"]
test: true
final_eval_experiment: rankflow
final_eval_split: test
final_eval_output_subdir: final_eval
