# @package _global_

# Entrypoint rules for `python src/train.py ...`
# - `/run` must be a train-oriented run config (`run.name` cannot be `eval_*`).
# - Current training flows in this repo require `/dataset`; the canonical CLI is
#   `python src/train.py experiment=train_rankflow dataset=webqsp-sub`.
# - Prefer `experiment=...` over ad hoc `/run + /trainer + /model` overrides so the
#   full training bundle stays aligned.
#
# Order of defaults determines the order in which configs override each other.
defaults:
  - _self_
  - ckpt: default
  - run: train_rankflow
  - dataset: null
  - data: graph_retrieval
  - model: gflownet
  - callbacks: default
  - logger: null
  - trainer: default
  - fit_schedule: pass
  - paths: default
  - extras: default
  - hydra: default
  - experiment: null 

# Task name and tags are run-driven, matching the eval entrypoint structure.
task_name: ${run.task_name}
tags: ${run.tags}

# Run-driven checkpoints.
ckpt_path: ${run.ckpt_path}
init_ckpt_path: ${run.init_ckpt_path}

# Seed for random number generators in pytorch, numpy and python.random.
seed: 42
