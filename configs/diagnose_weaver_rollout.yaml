# @package _global_

defaults:
  - paths: default
  - hydra: default
  - dataset: webqsp
  - datamodule: default
  - model: weaver
  - eval_metric: default
  - optimizer: adamw
  - scheduler: cosine_warmup
  - trainer: gpu
  - callbacks: eval
  - logger: none
  - ckpt: default
  - _self_

task_name: diagnose_weaver_rollout
seed: 42
print_config: false

split: validation
limit: 128
eval_num_rollout: 8
beam_sizes: [4, 8]
output_path: diagnostics_report.md

# If null, the script uses ckpt.path, then ckpt.pretrained. It intentionally
# does not auto-load stale checkpoints from outputs/checkpoints.
diagnose_ckpt_path: null

datamodule:
  eval_batch_size: 8
  eval_num_workers: 0
  num_workers: 0
  pin_memory: false

model:
  rollout_cfg:
    eval_num_rollout: ${eval_num_rollout}
    eval_chunk_size: ${eval_num_rollout}
