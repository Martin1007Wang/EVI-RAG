# Entrypoint rules for `python src/eval_hit_graph_reward.py ...`

defaults:
  - _self_
  - dataset: null
  - data: datamodule
  - model: gflownet
  - paths: default
  - hydra: default

task_name: eval_hit_graph_reward
seed: 42

split: ${dataset.val_split}

# Set null or <=0 to score the whole split.
max_graphs: 1000

# Match oracle rollout geometry to the main GFlowNet setup by default.
path_mode: undirected

# If true, stop once the teacher subgraph first reaches any target node.
stop_on_first_hit: true

answer_reward: ${model.answer_reward}
