_target_: lightning.pytorch.trainer.Trainer

# Eval/predict must run on exactly one GPU to avoid DDP sharding and non-deterministic
# metric aggregation across ranks. Select a specific GPU via CUDA_VISIBLE_DEVICES.
accelerator: gpu
devices: 1
profiler: null
precision: 32-true
max_epochs: 1
# Keep the key present so eval-time model configs can safely reference
# `${trainer.max_steps}` and still resolve to `null`.
max_steps: null
logger: null
enable_checkpointing: False
enable_progress_bar: True
deterministic: False
default_root_dir: ${paths.output_dir}
