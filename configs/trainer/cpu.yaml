_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

min_epochs: 0
max_epochs: -1
max_steps: 100000

# force CPU execution
accelerator: cpu
devices: 1
profiler: null

# full precision on CPU
precision: 32-true

# gradient accumulation to trade throughput for memory
accumulate_grad_batches: 1

# cudnn autotune not applicable on CPU
benchmark: false

# disable automatic clipping for manual optimization (model handles it)
gradient_clip_val: null

# Keep validation on a fixed optimizer-step cadence.
val_check_interval: 1000
check_val_every_n_epoch: null

# Custom train sampler handles DDP-aware step-driven sampling.
use_distributed_sampler: false

# skip sanity validation to avoid cold-start stalls on large datasets
num_sanity_val_steps: 0

# optional batch limits for profiling/debugging
limit_train_batches: null
limit_val_batches: null
limit_test_batches: null

# log interval (steps)
log_every_n_steps: 50

# set True to to ensure deterministic results
# makes training slower but gives more reproducibility than just setting seeds
deterministic: False
