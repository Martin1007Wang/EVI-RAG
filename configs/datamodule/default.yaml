# @package datamodule

_target_: src.data.datamodule.RetrievalDataModule

batch_size: 32
num_workers: 16

eval_batch_size: 32
eval_num_workers: 16

pin_memory: true
train_shuffle: true
drop_last: false
eval_drop_last: false

splits:
  train: train
  validation: validation
  test: test

lmdb_readahead: true
max_readers: 256
