# @package datamodule

_target_: src.data.datamodule.RetrievalDataModule

batch_size: 8
num_workers: 8

eval_batch_size: 8
eval_num_workers: 8

pin_memory: true
prefetch_factor: 2
train_shuffle: true
drop_last: false

splits:
  train: train
  validation: validation
  test: test

lmdb_readahead: true
max_readers: 256

train_indices: null
validation_indices: null
test_indices: null
