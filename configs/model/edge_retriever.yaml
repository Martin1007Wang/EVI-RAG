# Edge-iid supervised retriever baseline (SubgraphRAG-style supervision).

defaults:
  - _self_

_target_: src.models.edge_retriever_module.EdgeRetrieverModule
_recursive_: true

emb_dim: 1024
topic_pe: true
dde_num_rounds: 2
dde_num_reverse_rounds: 2

lr: 1.0e-4
weight_decay: 0.0

# Validation metrics: triple_recall@K
eval_k_list: [100]

# Export `top-K` scored triples as 1-hop rollouts (for LLM eval).
export_top_k: 100

# SubgraphRAG's original training uses `skip_no_path=true` which skips samples with
# no shortest path supervision (including zero-hop).
skip_no_path: true

# Label store for supervised training. This should be generated via:
#   python -m src.datasets.build_edge_retriever_labels dataset=<name>-sub
label_store_dir: ${dataset.artifact_dir}/edge_retriever_labels
label_store_template: "{split}.pt"
