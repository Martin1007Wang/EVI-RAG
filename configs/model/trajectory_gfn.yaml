defaults:
  - _self_

_target_: src.models.trajectory_gfn.module.TrajectoryGFlowNetModule
_recursive_: true

horizon_cfg:
  _target_: src.models.configs.trajectory_gfn.HorizonConfig
  max_steps: ${dataset.max_steps}
  min_stop_steps: 1

policy_cfg:
  _target_: src.models.configs.policy.PolicyConfig
  backbone:
    _target_: src.models.configs.policy.BackboneConfig
    embedding_dim: 1024
    hidden_dim: 512
    gnn_layers: 2
    gnn_dropout: 0.1
    use_adapter: true
    adapter_dim: 128
    adapter_dropout: 0.1
  flow_head:
    _target_: src.models.configs.policy.FlowHeadConfig
    hidden_dim: 512
    dropout: 0.0
    relation_low_rank: 16
  priority_head:
    _target_: src.models.configs.policy.PriorityHeadConfig
    hidden_dim: 256
    num_layers: 2
    dropout: 0.0
  stop_bias_init: -0.7
  stop_delta_scale: 2.0
  stop_delta_temperature: 1.0
  doob_h_alpha: 1.0
  doob_h_node_temperature: 1.0

training_cfg:
  _target_: src.models.configs.trajectory_gfn.TrajectoryTrainingConfig
  loss_type: db
  rollout_batch_size: 8
  lambda_start: 1.0
  lambda_move: 1.0
  lambda_stop: 1.0
  reward_epsilon: 1.0e-3
  wrong_stop_reward_mode: graph_normalized
  sampling_temperature: 1.0
  invalid_logits_policy: raise

inference_cfg:
  _target_: src.models.configs.trajectory_gfn.TrajectoryInferenceConfig
  mode: sampled
  answer_mass_threshold: 0.90
  support_mass_threshold: 0.90
  support_path_overlap_penalty: 0.25
  rollout_chunk_size: 16
  max_rollouts: 256
  answer_top_ks: [1, 5, 10]
  max_expansions: 20000
  max_frontier_size: 4096

optimizer_cfg:
  _target_: src.models.configs.training.OptimizerConfig
  type: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler_cfg:
  _target_: src.models.configs.training.SchedulerConfig
  type: cosine
  interval: step
  t_max: 10
  eta_min: 1.0e-6
