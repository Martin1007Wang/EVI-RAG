_target_: src.models.gflownet.GFlowNetModule
_recursive_: true
_convert_: all

max_steps: 3
num_rollout: 8
eval_num_rollout: 8
rollout_chunk_size: 4
eval_rollout_chunk_size: 4
eval_budgets: [1, 2, 4, 8]
temperature: 0.45
temperature_schedule:
  start: 0.45
  end: 0.45
  warmup_steps: 999999

backbone:
  hidden_dim: 1024
  gnn_num_layers: 3
  gnn_dropout: 0.1
  dde_max_distance: 4

policy_hidden_dim: 1024

action_head:
  zero_init_type_output: false

edge_scorer:
  prior_scale_init: 5.0
  prior_scale_trainable: false

reward:
  log_r_min: -5.0
  semantic_fallback_scale: 0.25
  relation_shaping_scale: 0.0
  positive_coverage_shaping_scale: 0.0
  distance_progress_shaping_scale: 0.0

loss:
  variant: fl_subtb
  subtb_lambda: 0.9
  log_reward_clip_min: -10.0
  reward_matching_coef: 1.0

teacher:
  enabled: true
  mode: bounded_path
  score_exponent: 0.5
  fallback_to_policy: true

schedule:
  warmup_steps: 200
  decay_steps: 1800
  initial_teacher_prob: 1.0
  final_teacher_prob: 0.0

replay:
  enabled: true
  capacity: 4096
  sample_size: 2
  warmup_steps: 200
  min_size: 64
  loss_coef: 0.2
  reset_on_fit_start: true
  priority_epsilon: 1.0e-6
  priority_exponent: 0.6
  importance_sampling_exponent: 0.4
  age_decay: 0.999

optimizer_cfg:
  type: adamw
  lr: 0.0001
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  log_z_head_lr_multiplier: 5.0

scheduler_cfg:
  type: cosine_with_warmup
  interval: step
  num_warmup_steps: 1000
