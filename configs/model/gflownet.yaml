defaults:
  - _self_

_target_: src.models.gflownet_module.GFlowNetModule
_recursive_: true

metric_runtime_factory:
  _target_: src.metrics.runtime_factory.GraphTaskRuntimeFactory

horizon_cfg:
  _target_: src.models.configs.gflownet.HorizonConfig
  max_steps: ${dataset.max_steps}

training_cfg:
  _target_: src.models.configs.gflownet.GFlowNetTrainingConfig
  sampling_temperature_schedule:
    _target_: src.models.configs.gflownet.SamplingTemperatureScheduleConfig
  action_prior_schedule:
    _target_: src.models.configs.gflownet.ActionPriorScheduleConfig
  success_replay:
    _target_: src.models.configs.gflownet.SuccessReplayConfig
  answer_quotient:
    _target_: src.models.configs.gflownet.AnswerQuotientConfig
  potential_reward:
    _target_: src.models.configs.gflownet.PotentialRewardConfig
  subtb:
    _target_: src.models.configs.gflownet.SubTrajectoryBalanceConfig

action_prior_cfg:
  _target_: src.models.configs.gflownet.ActionPriorConfig

policy_cfg:
  _target_: src.models.configs.policy.PolicyConfig
  backbone:
    _target_: src.models.configs.backbone.BackboneConfig
  prefix_controller:
    _target_: src.models.configs.policy.PrefixControllerConfig
  state_score_head:
    _target_: src.models.configs.policy.StateScoreHeadConfig
  transition_head:
    _target_: src.models.configs.policy.TransitionHeadConfig

eval_cfg:
  _target_: src.models.configs.gflownet.SearchEvalConfig
  flow_frontier:
    _target_: src.models.configs.gflownet.FlowFrontierEvalConfig
  monte_carlo:
    _target_: src.models.configs.gflownet.MonteCarloEvalConfig

optimizer_cfg:
  _target_: src.models.configs.training.OptimizerConfig

scheduler_cfg:
  _target_: src.models.configs.training.SchedulerConfig
  t_max: ${oc.select:trainer.max_steps,null}
