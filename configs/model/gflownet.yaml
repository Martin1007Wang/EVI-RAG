defaults:
  - _self_

_target_: src.models.gflownet_module.GFlowNetModule
_recursive_: true

# Model contract metadata. This block is stripped before hydra instantiation.
contract:
  task_family: answer_ranking
  train_dataset_scope: sub_only
  eval_entrypoint: eval
  train_entrypoint: train
  eval_execution_mode: [predict, test]
  validation_metrics_profile: rank_only
  final_eval_metrics_profile: full
  single_gpu_eval_only: true

metric_runtime_factory:
  _target_: src.metrics.answer_reachability.runtime.SearchMetricRuntimeFactory

horizon_cfg:
  _target_: src.models.configs.gflownet.HorizonConfig
  max_steps: ${dataset.max_steps}

training_cfg:
  _target_: src.models.configs.gflownet.GFlowNetTrainingConfig
  rollout_batch_size: 8
  reward_epsilon: 1.0e-3
  failure_reward_mode: graph_normalized
  answer_reward:
    _target_: src.models.configs.gflownet.AnswerRewardConfig
    mode: legacy
    positive_utility: 1.0
    negative_utility: -1.0
    beta: 1.0
    cycle_penalty: 1.0
    failure_length_penalty_alpha: 0.0
  guidance:
    _target_: src.models.configs.gflownet.GuidanceLossConfig
    loss_weight: 0.0
    detach_features: true
  sampling_temperature: 1.0
  sampling_temperature_schedule:
    _target_: src.models.configs.gflownet.SamplingTemperatureScheduleConfig
    type: constant
  success_replay:
    _target_: src.models.configs.gflownet.SuccessfulTrajectoryReplayConfig
    enabled: false
    ratio: 0.25
    warmup_passes: 1.0
    min_buffer_size: 256
    max_buffer_size: 50000
    max_trajectories_per_sample: 8
    max_rollouts_per_graph: 8
  adaptive_sampling:
    _target_: src.models.configs.gflownet.AdaptiveSamplingConfig
    enabled: true
    min_rollout_batch_size: 8
    max_rollout_batch_size: 64
    warmup_steps: 10
    ema_alpha: 0.2
    low_success_rate_threshold: 0.05
    high_success_rate_threshold: 0.35
    low_unique_success_paths_per_100_rollouts: 0.5
    high_unique_success_paths_per_100_rollouts: 5.0
    low_start_entropy_normalized: 0.35
    high_start_entropy_normalized: 0.85
    low_subtb_residual_variance: 0.05
    high_subtb_residual_variance: 0.5
    rollout_growth_factor: 1.5
    rollout_shrink_factor: 0.75
    temperature_multiplier_up: 1.15
    temperature_multiplier_down: 0.92
    min_temperature_multiplier: 0.5
    max_temperature_multiplier: 2.5
  subtb:
    _target_: src.models.configs.gflownet.SubTrajectoryBalanceConfig
    lambda_weight: 1.0
    normalize: true

heuristic_cfg:
  _target_: src.models.configs.gflownet.HeuristicConfig
  # Default training path keeps behavior sampling on-policy; eval experiments can
  # still override this with topology/embedding heuristics when needed.
  kind: none
  beta: 0.0
  topology_restart_prob: 0.25
  topology_num_iters: 8
  topology_eps: 1.0e-8
  embedding_temperature: 1.0
  learned_hidden_dim: 256
  learned_dropout: 0.0

policy_cfg:
  _target_: src.models.configs.policy.PolicyConfig
  backbone:
    _target_: src.models.configs.backbone.BackboneConfig
    embedding_dim: 1024
    hidden_dim: 512
    gnn_layers: 2
    gnn_dropout: 0.1
    use_adapter: true
    adapter_dim: 128
    adapter_dropout: 0.1
  prefix_controller:
    _target_: src.models.configs.policy.PrefixControllerConfig
    dropout: 0.0
  state_score_head:
    _target_: src.models.configs.policy.StateScoreHeadConfig
    hidden_dim: 256
    num_layers: 2
    dropout: 0.0
  forward_policy_head:
    _target_: src.models.configs.policy.TransitionPolicyHeadConfig
    hidden_dim: 256
    num_layers: 2
    dropout: 0.0
    microbatch_size: 4096
  # Backward transitions are not learned: on the discrete prefix-tree state
  # space, every non-root state has exactly one legal parent.
  candidate_shortlist:
    _target_: src.models.configs.policy.CandidateShortlistConfig
    enabled: false
    topk: 16
    degree_threshold: 32
    heuristic_weight: 1.0

eval_cfg:
  _target_: src.models.configs.gflownet.SearchEvalConfig
  # Base model defaults use deterministic flow-frontier search for full
  # answer-reachability evaluation. Training experiments still override to
  # rank_only validation for a cheaper fit loop, while Monte Carlo knobs remain
  # available for legacy and edge-retrieval paths.
  strict_search: true
  metrics_profile: full
  support_search_method: flow_frontier
  flow_prune_epsilon: 1.0e-3
  monte_carlo_rollouts: 4096
  monte_carlo_confidence: 0.95
  answer_mass_threshold: 0.90
  support_mass_threshold: 0.90
  support_path_overlap_penalty: 0.25
  window_top_ks: [1, 10, 25, 50, 100]
  answer_top_ks: [1, 5, 10]
  max_expansions: 20000
  max_frontier_size: 4096

optimizer_cfg:
  _target_: src.models.configs.training.OptimizerConfig
  type: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler_cfg:
  _target_: src.models.configs.training.SchedulerConfig
  type: cosine
  interval: step
  t_max: ${oc.select:trainer.max_steps,null}
  eta_min: 1.0e-6
