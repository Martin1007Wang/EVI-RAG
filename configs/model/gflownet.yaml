# @package model
# GFlowNet 配置 - 完全扁平化，无嵌套结构

_target_: src.models.gflownet.GFlowNetModule
_recursive_: true
_convert_: all

# 核心训练参数
max_steps: ${dataset.max_steps}
num_rollout: 8
strict_on_policy: true

# 温度调度
sampling_temperature_schedule:
  schedule_type: linear
  initial_value: 1.0
  final_value: 1.0
  total_steps: 1

# 策略网络
backbone:
  hidden_dim: 512
  gnn_num_layers: 2
  gnn_dropout: 0.1

policy_hidden_dim: 512

relation_prior:
  prior_lambda_init: 10.0
  learnable_prior_scale: true
  positive_prior_scale: true
  zero_init_type_output: true
  zero_init_expand_edge_output: true

answer_reward:
  hit_reward_base: 5.0
  hit_reward_max: 50.0
  miss_reward: 0.01
  penalty_step: 0.98
  penalty_dead: 0.2

teacher_warmstart:
  path_mode: undirected
  stop_on_first_hit: true

training_curriculum:
  warmup_steps: 2000
  blend_steps: 3000
  edge_teacher_weight: 1.0
  stop_teacher_weight: 3.0
  tb_final_weight: 1.0

optimizer_cfg:
  type: adamw
  lr: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  log_z_head_lr_multiplier: 1.0

scheduler_cfg:
  type: onecycle
  interval: step         # 必须改为 step
  lr: 0.0001             # 这里是 max_lr，与 optimizer 保持一致即可
  pct_start: 0.1         # 前 10% 的训练步数用于 Warmup (非常关键)
  anneal: cos            # 衰减策略
