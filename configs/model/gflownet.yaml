_target_: src.models.gflownet.GFlowNetModule
_recursive_: true
_convert_: all

# ── 1. 基础探索设置 ──
expand_budget: 3
num_rollout: 8
eval_num_rollout: 8
rollout_chunk_size: 4
eval_rollout_chunk_size: 4
eval_budgets: [1, 2, 4, 8]
temperature: 0.45 

# ── 2. 网络架构 ──
policy_hidden_dim: 1024

backbone_cfg:
  hidden_dim: 1024
  gnn_num_layers: 3
  gnn_dropout: 0.1

action_head_cfg:
  zero_init_type_output: false

edge_scorer_cfg:
  prior_scale_init: 5.0
  prior_scale_trainable: false

# ── 3. 奖励与损失函数 ──
reward_cfg:
  log_r_min: -5.0  # terminal reward floor; part of reward semantics, not shaping
  zero_f1_edge_bonus_scale: 0.25  # weak zero-F1 tie-breaker on selected non-root edge relations

loss_cfg:
  variant: fl_subtb
  subtb_lambda: 0.9
  log_reward_clip_min: -10.0
  reward_matching_coef: 1.0

# ── 4. 导师引导与余弦退火调度 ──
teacher_cfg:
  teacher_enabled: true
  teacher_score_exponent: 1.0

curriculum_cfg:
  curriculum_warmup_steps: 200         
  curriculum_decay_steps: 2000            
  curriculum_initial_prob: 0.95
  curriculum_final_prob: 0.05

# ── 5. 优化器与学习率 ──
optimizer_cfg:
  type: adamw
  lr: 0.0001
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  log_z_head_lr_multiplier: 5.0

scheduler_cfg:
  type: cosine_with_warmup
  interval: step
  num_warmup_steps: 1000
