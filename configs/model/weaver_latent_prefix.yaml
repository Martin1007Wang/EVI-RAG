# @package model

_target_: src.weaver.latent_prefix_module.LatentPrefixWeaverModule

policy_feature_encoder:
  _target_: src.weaver.nn.feature_encoder.FeatureEncoder
  entity_text_semantic_table: null
  text_row_by_entity_id: null
  relation_semantic_table: null
  model_dim: 1024
  non_text_node_init_std: 0.02

proposal_policy:
  _target_: src.weaver.policy.EdgeOnlyProposalPolicy
  max_expand_budget: ${model.rollout_engine.expand_budget}
  state_encoder:
    _target_: src.weaver.nn.state_encoder.StateEncoder
    hidden_dim: 1024
    edge_encoder:
      _target_: src.weaver.nn.edge_encoder.EdgeEncoder
      hidden_dim: 1024

prefix_selector:
  _target_: src.weaver.policy.PrefixSelector
  state_encoder:
    _target_: src.weaver.nn.state_encoder.StateEncoder
    hidden_dim: 1024
    edge_encoder:
      _target_: src.weaver.nn.edge_encoder.EdgeEncoder
      hidden_dim: 1024

reward_model:
  _target_: src.weaver.utility.TrueTerminalReward
  edge_cost: 0.05
  fail_cost: 1.0
  reward_temperature: 1.0

objective:
  _target_: src.weaver.objectives.LatentPrefixObjective
  prefix_temperature: 1.0
  length_prior_gamma: 0.05
  lambda_prefix: 1.0
  lambda_edge: 0.1
  initial_log_z: 0.0

rollout_engine:
  _target_: src.weaver.rollout.LatentPrefixRolloutEngine
  expand_budget: 3

train_num_rollouts: 8
eval_num_rollouts: 16

optimization:
  _target_: src.training.config.OptimizationRuntimeConfig
  optimizer:
    _target_: src.training.config.OptimizerRuntimeConfig
    type: adamw
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
    no_decay_on_bias_and_norm: true
  scheduler:
    _target_: src.training.config.SchedulerRuntimeConfig
    type: cosine
    interval: step
    warmup_ratio: 0.2
    eta_min: 0.0

evaluation:
  _target_: src.training.config.EvalRuntimeConfig
  k_windows: [1, 2, 4, 8]
  exclude_anchors_from_retrieved: true
  use_reachable_targets: true
  enable_calibration_metrics: false
  enable_terminal_diagnostics: false

gradient_clip_val: 1.0
gradient_clip_algorithm: norm
