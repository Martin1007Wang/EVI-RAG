# @package model

_target_: src.weaver.module.WeaverModule

budget: 8
hidden_dim: 1024

feature_encoder:
  _target_: src.weaver.feature.FeatureEncoder
  entity_text_semantic_table: null
  text_row_by_entity_id: null
  relation_semantic_table: null
  non_text_node_init_std: 0.02

policy:
  _target_: src.weaver.policy.ForwardPolicy
  action_hidden_dim: null
  semantic_relation_weight: 1.0
  semantic_dst_weight: 0.5
  edge_residual_weight: 0.25
  frontier_size_correction: 1.0
  state_encoder:
    _target_: src.weaver.nn.state_encoder.StateEncoder
    hidden_dim: ${model.hidden_dim}

reward_model:
  _target_: src.weaver.reward.EvidenceSubgraphReward
  beta: 2.0
  epsilon: 1.0e-6
  answer_weight: 1.0
  edge_cost: 0.05
  reward_temperature: 1.0
  
objective:
  _target_: src.weaver.objectives.EdgeFlowMatchingObjective
  nonterminal_weight: 1.0
  terminal_weight: 1.0
  residual_loss: huber
  huber_delta: 2.0
  backward_kernel: uniform_parent
  policy_state_chunk_size: 8

runner:
  _target_: src.weaver.rollout.runner.RolloutRunner
  engine:
    _target_: src.weaver.rollout.engine.RolloutEngine

  replay_source:
    _target_: src.weaver.rollout.replay.WeakTransitionSource
    max_depth: ${model.budget}
    mode: positive_frontier
    max_transitions_per_graph: 128
    max_states_per_graph: 64
    sample_by: weak_weight
    max_positive_edges_per_state: 8
  train_policy_rollouts: 8
  eval_rollouts: 8

optimization:
  optimizer:
    type: adamw
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
    no_decay_on_bias_and_norm: true
  scheduler: null

evaluation:
  k_windows: [1, 2, 4, 8]
  exclude_anchors_from_retrieved: true
  use_reachable_targets: true
  enable_terminal_diagnostics: true

validate_batch_coordinates: false
