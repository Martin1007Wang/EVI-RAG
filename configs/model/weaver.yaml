# @package model

_target_: src.weaver.module.WeaverModule

budget: 8
sem_dim: 1024
hidden_dim: 512

feature_encoder:
  _target_: src.weaver.feature.FeatureEncoder
  entity_text_semantic_table: null
  text_row_by_entity_id: null
  entity_relation_neighborhood_semantic_table: null
  relation_neighborhood_row_by_entity_id: null
  relation_semantic_table: null
  sem_dim: ${model.sem_dim}
  hidden_dim: ${model.hidden_dim}

policy:
  _target_: src.weaver.policy.ForwardPolicy
  state_encoder:
    _target_: src.weaver.feature.StateEncoder
    hidden_dim: ${model.hidden_dim}
  flow_estimator:
    _target_: src.weaver.policy.FlowEstimator
    hidden_dim: ${model.hidden_dim}
    relation_lambda: 0.5
  state_flow_head:
    _target_: src.weaver.policy.StateFlowHead
    state_dim: ${model.hidden_dim}

terminal_reward_model:
  _target_: src.weaver.reward.TerminalRewardModel
  eps: 1.0
  answer_weight: 6.0
  coverage_weight: 1.0
  edge_cost: 0.15
  fail_cost: 6.0
  answer_prize: 2.0

objective:
  _target_: src.weaver.objectives.SubTrajectoryBalanceObjective
  subtb_lambda: 1.0
  max_subtrajectory_length: null

runner:
  _target_: src.weaver.rollout.runner.RolloutRunner
  engine:
    _target_: src.weaver.rollout.engine.RolloutEngine
  replay_source:
    _target_: src.weaver.rollout.replay.ReplaySource
    anneal_steps: null
  train_policy_rollouts: 8
  eval_rollouts: 8

optimization:
  optimizer:
    type: adamw
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
    no_decay_on_bias_and_norm: true
  scheduler: null

evaluation:
  k_windows: [1, 2, 4, 8]
  exclude_anchors_from_retrieved: true
  use_reachable_targets: true
  enable_terminal_diagnostics: true

validate_batch_coordinates: false
