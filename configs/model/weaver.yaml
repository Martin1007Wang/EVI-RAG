# @package model

_target_: src.weaver.module.WeaverModule

budget: 8
sem_dim: 1024
hidden_dim: 512

feature_encoder:
  _target_: src.weaver.feature.FeatureEncoder
  entity_text_semantic_table: null
  text_row_by_entity_id: null
  entity_relation_neighborhood_semantic_table: null
  relation_neighborhood_row_by_entity_id: null
  relation_semantic_table: null
  sem_dim: ${model.sem_dim}
  hidden_dim: ${model.hidden_dim}
  
policy:
  _target_: src.weaver.policy.ForwardPolicy
  frontier_pruning:
    _target_: src.weaver.policy.FrontierPruningConfig
    enabled: true
    threshold: 0.4
    min_keep_per_state: 32
    apply_train: true
    apply_eval: true
    keep_recorded_edges_in_train: true

  state_encoder:
    _target_: src.weaver.feature.StateEncoder
    hidden_dim: ${model.hidden_dim}

  flow_estimator:
    _target_: src.weaver.policy.FlowEstimator
    hidden_dim: ${model.hidden_dim}

    # Flat action energy:
    #   L_e(z) = align_scale * a(q,e) + c_theta(z,e)
    # No frontier-internal normalization.
    align_scale_init: 1.0

    # 0.0 = flat-sum:
    #   continue mass uses sum_e exp(L_e)
    frontier_size_correction: 0.0

    # In flat policy STOP directly competes with all edge energies.
    # 0.0 is safer than the old 1.5.
    stop_initial_bias: 0.0

    edge_state_hidden_dim: 256
    edge_dropout: 0.1

  state_flow_head:
    _target_: src.weaver.policy.StateFlowHead
    state_dim: ${model.hidden_dim}

  backward_policy:
    _target_: src.weaver.policy.BackwardPolicy
    hidden_dim: ${model.hidden_dim}

reward_model:
  _target_: src.weaver.reward.EvidenceStateScorer
  reward_beta: 3.0
  edge_cost_lambda: 0.5
  reward_epsilon: 1.0e-4
  center_log_reward: true
  budget: ${model.budget}

objective:
  _target_: src.weaver.objectives.ForwardLookingSubTBObjective
  subtb_lambda: 0.9
  terminal_loss_weight: 2.0
  replay_loss_weight: 0.25
  backward_aux_weight: 0.0
  path_nce_weight: 0.0
  path_nce_temperature: 1.0


runner:
  _target_: src.weaver.rollout.runner.RolloutRunner
  engine:
    _target_: src.weaver.rollout.engine.RolloutEngine
  replay_source:
    _target_: src.weaver.rollout.replay.ReplaySource
    metric_name: val/rollout_union@8/recall
    threshold: 0.8
  replay_keep_ratio: 0.5
  min_replay_per_graph: 1
  train_policy_rollouts: 16
  eval_rollouts: 32

optimization:
  optimizer:
    type: adamw
    lr: 3.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.999]
    eps: 1.0e-8
    no_decay_on_bias_and_norm: true

  scheduler:
    type: warmup_cosine
    interval: step
    warmup_ratio: 0.1
    eta_min: 3.0e-5
    
evaluation:
  k_windows: [1, 2, 4, 8]
  exclude_anchors_from_retrieved: true
  use_reachable_targets: true
  enable_terminal_diagnostics: true
  diversity_edge_penalty: 0.0

validate_batch_coordinates: false
