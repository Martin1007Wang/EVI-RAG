# @package model

_target_: src.weaver.module.WeaverModule

policy_cfg:
  hidden_dim: 1024
  state_readout_dropout: 0.0

  feature_encoder:
    embedding_dim: 1024
    hidden_dim: 1024
    dde:
      enabled: true
      num_forward_rounds: 2
      num_backward_rounds: 2
      include_anchor_indicator: true
    role_projection: linear_layernorm
    role_projection_init: identity
    non_text_init_std: 0.02

  state_readout:
    num_layers: 1
    dropout: 0.0
    use_path_memory: true
    use_frontier_summary: true

  transition_features: {}

  stop_scorer:
    use_progress: true
    use_frontier_summary: true
    stop_bias_init: 0.0
    expand_bias_init: 0.0
    progress_penalty_init: 0.0
    dropout: 0.0
    trainable_bias: true

  edge_scorer:
    type: semantic_prior_residual
    action_dropout: 0.0
    entity_weight_init: 0.1
    logit_scale_init: 5.0
    residual_scale_init: 1.0
    residual_warmup_start_step: 500
    residual_warmup_steps: 1500
    residual_max_multiplier: 1.0
    freeze_residual_until_step: 0
    zero_init_residual_output: true
    trainable_entity_weight: false
    trainable_logit_scale: false
    trainable_residual: true

  flow_head:
    num_layers: 1
    dropout: 0.0
    zero_init: true

rollout_cfg:
  expand_budget: 3
  train_num_rollout: 8
  eval_num_rollout: 8
  train_chunk_size: 8
  eval_chunk_size: 8
  use_static_batch_rollouts: false
  use_fused_static_batch_rollouts: false

  stop_adv:
    enabled: false
    topk_by_semantic: 8
    topk_by_final: 8
    random_k: 8
    continue_pool: max
    continue_pool_temperature: 0.5
    label_temperature: 0.5

eval_cfg: ${eval_metric}

schedule_cfg:
  temperature: 1.0
  eval_temperature: 1.0

  temperature_cfg:
    temperature_start: 1.0
    temperature_end: 1.0
    temperature_warmup_steps: 1

reward_cfg:
  utility_epsilon: 1.0e-4
  log_reward_clip_min: -30.0
  edge_cost: 0.10
  debug_checks: false

loss_cfg:
  max_trajectory_len: null
  subtb_lambda: 0.9
  subtb_coef: 1.0
  stop_tb_coef: 1.0
  stop_adv_coef: 0.0
  debug: false

diagnostic_cfg:
  train_rollout_diagnostics: false
  train_rollout_diagnostics_interval: 0
  train_stop_counterfactual: false
  train_policy_diagnostics: true
  train_validate_rollout_depth: false

  eval_stop_counterfactual: false
  eval_validate_rollout_depth: false

  grad_norm_interval: 0

optimizer_cfg: ${optimizer}
scheduler_cfg: ${scheduler}

gradient_clip_val: null
gradient_clip_algorithm: null
