# @package model

_target_: src.weaver.module.WeaverModule

budget: 8

policy_feature_encoder:
  _target_: src.weaver.nn.feature_encoder.FeatureEncoder
  entity_text_semantic_table: null      # injected by builder
  text_row_by_entity_id: null           # injected by builder
  relation_semantic_table: null         # injected by builder
  non_text_node_init_std: 0.02

policy:
  _target_: src.weaver.policy.ForwardPolicy
  budget: ${model.budget}
  action_hidden_dim: null
  semantic_relation_weight: 1.0
  semantic_dst_weight: 0.5
  edge_residual_weight: 0.25
  frontier_size_correction: 1.0
  state_encoder:
    _target_: src.weaver.nn.state_encoder.StateEncoder
    hidden_dim: 1024
    edge_encoder:
      _target_: src.weaver.nn.edge_encoder.EdgeEncoder
      hidden_dim: 1024
    token_pooler:
      _target_: src.weaver.nn.state_encoder.QueryTokenPooler
      hidden_dim: 1024

reward_model:
  _target_: src.weaver.reward.EvidenceSubgraphReward
  answer_weight: 4.0
  proximity_weight: 1.0
  path_weight: 0.2
  fail_cost: 8.0
  fail_proximity_weight: 0.5
  fail_path_weight: 0.1
  edge_cost: 0.1
  distance_temperature: 1.0
  reward_temperature: 1.0

loss_fn:
  _target_: src.weaver.objectives.SubTBObjective
  alpha_replay: 0.0
  subtb_lambda: 0.8
  max_len: null
  residual_loss: huber
  huber_delta: 2.0

weak_replay_loss:
  _target_: src.weaver.objectives.WeakReplayLoss
  weight: 3.0

runner:
  _target_: src.weaver.rollout.runner.RolloutRunner
  engine:
    _target_: src.weaver.rollout.engine.RolloutEngine
    budget: ${model.budget}
  train_policy_rollouts: 8
  eval_rollouts: 8
  weak_replay_source:
    _target_: src.weaver.rollout.replay.WeakReplaySource
    budget: ${model.budget}
    states_per_graph: 8
    branch_per_state: 2

optimization:
  _target_: src.training.config.OptimizationRuntimeConfig
  optimizer:
    _target_: src.training.config.OptimizerRuntimeConfig
    type: adamw
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
    no_decay_on_bias_and_norm: true
  scheduler: null

evaluation:
  _target_: src.training.config.EvalRuntimeConfig
  k_windows: [1, 2, 4, 8]
  exclude_anchors_from_retrieved: true
  use_reachable_targets: true
  enable_terminal_diagnostics: false
