# @package model

_target_: src.weaver.module.WeaverModule

hidden_dim: 1024
manual_accumulate_grad_batches: 2

policy:
  mode: bdb
  flow_budget_conditioning: additive
  edge_scorer: relation_residual
  evidence_state_encoder_dropout: 0.0
  relation_residual_edge_scorer:
    alpha_rel_init: 1.0
    alpha_dst_init: 0.0
    alpha_trainable: true
    residual_scale_init: 0.05
    residual_scale_trainable: true
    residual_warmup_steps: 0
    topk_overlap_k: 5
  feature_encoder:
    dde:
      enabled: true
      num_forward_rounds: 2
      num_backward_rounds: 2
      include_anchor_indicator: true
    role_projection: linear_layernorm
    role_projection_init: identity
    non_text_init_std: 0.02
  evidence_state_encoder:
    num_layers: 1
    dropout: 0.0
  flow_head:
    num_layers: 1
    dropout: 0.0
    zero_init: true
    bias_init: 0.0

rollout:
  expand_budget: 2
  train_num_rollout: 8
  eval_num_rollout: 8

sampling:
  train_temperature: 1.0
  eval_temperature: 1.0

reward:
  answer_credit: 2.0
  edge_cost: 0.05
  fail_penalty: 2.0
  expand_budget: ${model.rollout.expand_budget}
  debug_checks: false

loss:
  type: bdb
  child_flow_target: detach_current
  backward_kernel: uniform_boundary
  edge_mode: full
  child_chunk_size: 512
  state_sources:
    rollout: true
    oracle_prefix: false
    counterfactual: false

eval: ${eval_metric}

runtime:
  train_chunk_size: 2
  eval_chunk_size: 4

diagnostics:
  train_rollout_diagnostics: false
  train_rollout_diagnostics_interval: 0
  train_policy_diagnostics: false
  train_validate_rollout_depth: false
  eval_validate_rollout_depth: false
  grad_norm_interval: 0

optimizer_cfg: null
scheduler_cfg: null

gradient_clip_val: 1.0
gradient_clip_algorithm: norm
