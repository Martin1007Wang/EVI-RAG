# @package model

_target_: src.weaver.module.WeaverModule

policy_feature_encoder:
  _target_: src.weaver.nn.feature_encoder.FeatureEncoder
  entity_text_semantic_table: null
  text_row_by_entity_id: null
  relation_semantic_table: null
  model_dim: 1024
  non_text_node_init_std: 0.02

policy:
  _target_: src.weaver.policy.ForwardPolicy
  max_expand_budget: ${model.runner.engine.expand_budget}
  state_encoder:
    _target_: src.weaver.nn.state_encoder.StateEncoder
    hidden_dim: 1024
    edge_encoder:
      _target_: src.weaver.nn.edge_encoder.EdgeEncoder
      hidden_dim: 1024

reward_model:
  _target_: src.weaver.utility.TrueTerminalReward
  edge_cost: 0.05
  fail_cost: 1.0
  reward_temperature: 1.0

policy_objective:
  _target_: src.weaver.objectives.SubTBLoss
  alpha_replay: 1.0
  subtb_lambda: 0.9
  max_len: null
  residual_loss: huber
  huber_delta: 2.0

runner:
  _target_: src.weaver.rollout.runner.RolloutRunner
  engine:
    _target_: src.weaver.rollout.engine.RolloutEngine
    expand_budget: 3
  train_num_rollouts: 8
  eval_num_rollouts: 16
  replay_source:
    _target_: src.weaver.rollout.replay.ReplaySource
    expand_budget: ${model.runner.engine.expand_budget}
  replay_builder:
    _target_: src.weaver.rollout.replay.ReplayBuilder
    expand_budget: ${model.runner.engine.expand_budget}
  replay_schedule:
    _target_: src.weaver.rollout.runner.ReplaySchedule
    rows:
      - _target_: src.weaver.rollout.runner.ReplayScheduleRow
        until_progress: 0.0
        policy_rollout: 1.0
        replay_expand: 1.0

optimization:
  _target_: src.training.config.OptimizationRuntimeConfig
  optimizer:
    _target_: src.training.config.OptimizerRuntimeConfig
    type: adamw
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
    no_decay_on_bias_and_norm: true
  scheduler:
    _target_: src.training.config.SchedulerRuntimeConfig
    type: cosine
    interval: step
    warmup_ratio: 0.2
    eta_min: 0.0

evaluation:
  _target_: src.training.config.EvalRuntimeConfig
  k_windows: [1, 2, 4, 8]
  exclude_anchors_from_retrieved: true
  use_reachable_targets: true

gradient_clip_val: 1.0
gradient_clip_algorithm: norm
