# @package model.eval_cfg.monte_carlo

rollouts: 4096
# Run large Monte Carlo budgets in smaller chunks so eval stays within memory.
batch_rollouts: 256
temperature: 1.0
confidence: 0.95
answer_aggregation:
  # `vote` uses a count-based posterior surrogate; weighted backends can
  # emphasize higher-reward or higher-probability terminal witnesses.
  backend: vote
early_stop:
  enabled: true
  min_rollouts: 512
  stability_top_k: 1
action_pruning:
  # The strict paper-style mainline disables pruning by default so Monte Carlo
  # support matches the full hierarchical action space.
  per_node_top_k: 0
  per_state_top_k: 0
