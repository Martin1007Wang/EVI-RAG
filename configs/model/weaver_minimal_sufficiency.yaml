defaults:
  - weaver
  - _self_

rollout_cfg:
  coverage_num_rollout: 2

coverage_cfg:
  enabled: true
  type: minimal_sufficiency
  min_utility: 1.0e-6
  gain_margin: 0.02
  expand_temperature: 1.0

schedule_cfg:
  proposal_cfg:
    enabled: true
    warmup_steps: 100
    decay_steps: 1000
    initial_prob: 0.5
    final_prob: 0.0
