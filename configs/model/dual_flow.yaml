#
# DualFlow model configuration (DualFlow training/eval).

defaults:
  - _self_

_target_: src.models.dual_flow_module.DualFlowModule
_recursive_: true

hidden_dim: 1024
emb_dim: 1024
gnn_layers: 2
gnn_dropout: 0.1
embedding_adapter_cfg:
  adapter_dim: 256
  dropout: 0.1
degree_bucket_cfg:
  num_buckets: 64
  # max_log_deg computed from webqsp (train/val/test) forward degrees; update when cwq stats available.
  max_log_deg: 8.0

max_steps: ${dataset.max_steps}

runtime_cfg:
  stop_min_steps: 0
  p0_mode: uniform
  p0_semantic_scale: 1.0
  stop_reward_mode: uniform_node
  stop_reward_epsilon: 1.0e-6
  gamma: 1.0
  logit_scale_init: 0.0
  logit_scale_schedule:
    enabled: false
    start: 1.0
    end: 1.0
  exploration_cfg:
    epsilon: 0.1
    warmup_steps: 3000
  log_z_bias_init: -1.0
  # Pure-A: no topology prior in forward logits.

optimizer_cfg:
  type: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4

scheduler_cfg:
  type: onecycle
  interval: step
  max_lr: 1.0e-4
  pct_start: 0.3

training_cfg:
  accumulate_grad_batches: 1
  # Reduce rollout count for training throughput.
  num_rollouts: 4
  # Manual optimization uses explicit clipping (Trainer gradient_clip_val is disabled).
  grad_clip_norm: 1.0
  db_cfg:
    sampling_temperature_start: 2.0
    sampling_temperature_end: 1.0
  lookahead_cfg:
    enabled: false
    log_f_floor: 0.0
    boost: 0.0

evaluation_cfg:
  beam_size: 200
  diverse_beam:
    enabled: true
    groups: 4
    penalty: hard
    similarity: tail
    lambda: 1.0
  answer_gain_stop:
    enabled: false
    patience: 5
    epsilon: 0.0
    min_beam: 1
