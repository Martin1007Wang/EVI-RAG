#
# DualFlow model configuration (strict typed config sections).

defaults:
  - _self_

_target_: src.models.dual_flow_module.DualFlowModule
_recursive_: true

env_cfg:
  _target_: src.models.configs.environment.EnvironmentConfig
  prior:
    _target_: src.models.configs.environment.PriorConfig
    pb_mode: uniform_in_degree
  stop:
    _target_: src.models.configs.environment.StopConfig
    enabled: true
    reward_base: 1.0
    reward_epsilon: 1.0e-4
    reward_beta_init: 0.6
    reward_beta_max: 1.0
    reward_beta_anneal_steps: 8000
    reward_beta_anneal_start_step: 0
    reward_beta_schedule: linear
    degree_penalty_alpha: 0.0
    degree_penalty_min_degree: 1.0
  super_source_enabled: true

policy_cfg:
  _target_: src.models.configs.policy.PolicyConfig
  backbone:
    _target_: src.models.configs.policy.BackboneConfig
    embedding_dim: 1024
    hidden_dim: 1024
    gnn_layers: 2
    gnn_dropout: 0.1
    use_adapter: true
    adapter_dim: 256
    adapter_dropout: 0.1
    use_positional_encoding: true
    use_film: true
  flow_head:
    _target_: src.models.configs.policy.FlowHeadConfig
    hidden_dim: 512
    num_layers: 2
    dropout: 0.0
    flow_projection_eps: 1.0e-8
    relation_low_rank: 64
  priority_head:
    _target_: src.models.configs.policy.PriorityHeadConfig
    hidden_dim: 256
    num_layers: 2
    dropout: 0.0
  stop_bias_init: -10.0
  topk_prune_train_k: 0
  topk_prune_train_k_final: 256
  topk_prune_warmup_steps: 2000
  topk_prune_anneal_steps: 8000
  topk_prune_eval_k: 256

sampling_cfg:
  _target_: src.models.configs.search.RolloutConfig
  num_rollouts: 4
  max_steps: ${dataset.max_steps}
  stop_min_steps: 1
  backward_prior_mode: ${model.env_cfg.prior.pb_mode}
  train_oracle_force_stop: false
  sampling_temperature: 1.0
  sampling_mode: gumbel
  eval_sampling_temperature: 0.5
  eval_sample_without_replacement: true

eval_cfg:
  _target_: src.models.configs.search.BeamSearchConfig
  beam_size: 50
  max_steps: ${dataset.max_steps}
  diverse_penalty: 0.0
  require_done: true
  rollout_metrics_every_n_batches: 0

subtb_cfg:
  _target_: src.models.configs.objective.SubTBConfig
  lambda_weight: 0.9
  normalize: true
  detach_end_flow: true
  boundary_weight: 0.2
  miss_length_penalty: 0.0
  ranking_weight: 0.2
  ranking_listwise_weight: 0.5
  ranking_bce_weight: 1.0
  ranking_hard_negative_k: 64
  ranking_margin: 0.1
  ranking_temperature: 1.0

training_cfg:
  _target_: src.models.configs.training.TrainingConfig
  replay_cfg:
    _target_: src.models.configs.training.ReplayBufferConfig
    enabled: true
    alpha_init: 0.35
    alpha_final: 0.1
    alpha_anneal_epochs: 20
    max_paths_per_pair: 24
    max_paths_per_graph: 256
    max_shortest_paths_per_pair: 4
    max_dfs_paths_per_pair: 12
    max_depth: ${dataset.max_steps}
    allow_cycles: true
    max_node_visits: 2
    track_visited_mask: true
    path_sampling_temperature: 1.0
    shortest_gap_weight: 1.0
    revisit_penalty_weight: 0.5

optimizer_cfg:
  _target_: src.models.configs.training.OptimizerConfig
  type: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler_cfg:
  _target_: src.models.configs.training.SchedulerConfig
  type: onecycle
  interval: step
  t_max: 10
  eta_min: 0.0
  warmup_steps: 0
