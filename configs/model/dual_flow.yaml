#
# DualFlow model configuration (DualFlow training/eval).

defaults:
  - _self_

_target_: src.models.dual_flow_module.DualFlowModule
_recursive_: true

hidden_dim: 1024
emb_dim: 1024
gnn_layers: 2
gnn_dropout: 0.1
embedding_adapter_cfg:
  adapter_dim: 256
  dropout: 0.1

max_steps: ${dataset.max_steps}

runtime_cfg:
  avoid_revisit: false
  stop_min_steps: 1

optimizer_cfg:
  type: adamw
  lr: 4.0e-4
  weight_decay: 1.0e-4

scheduler_cfg:
  type: onecycle
  interval: step
  max_lr: 1.0e-4
  pct_start: 0.3

training_cfg:
  accumulate_grad_batches: 1
  # Reduce rollout count for training throughput.
  num_rollouts: 4
  # Manual optimization uses explicit clipping (Trainer gradient_clip_val is disabled).
  grad_clip_norm: 1.0
  db_cfg:
    sampling_temperature_start: 2.5
    sampling_temperature_end: 1.2
    # Cosine anneal grounding from soft -> hard to stabilize cold-start training.
    dead_end_log_reward_start: -10.0
    dead_end_log_reward: -25.0
    emit_log_reward: -30.0
    dead_end_weight: 0.5

evaluation_cfg:
  beam_size: 200
  diverse_beam:
    enabled: true
    groups: 4
    penalty: hard
    similarity: tail
    lambda: 1.0
  answer_gain_stop:
    enabled: true
    patience: 5
    epsilon: 0.0
    min_beam: 1
