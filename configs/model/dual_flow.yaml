#
# DualFlow model configuration (GFlowNet training/eval).

defaults:
  - _self_
  - db: uniform

_target_: src.models.dual_flow_module.DualFlowModule
_recursive_: true

hidden_dim: 1024
emb_dim: 1024
backbone_finetune: false
gnn_layers: 2
gnn_dropout: 0.0
cvt_init_cfg:
  enabled: true
embedding_adapter_cfg:
  enabled: true
  adapter_dim: 256
  dropout: 0.1
actor_cfg:
  edge_inter_dim: 256
  edge_dropout: 0.1
  use_spherical: true
  temperature_init: 0.1
  norm_eps: 1.0e-6
  logit_scale_min: 1.0e-3
  logit_scale_max: 50.0

max_steps: ${dataset.max_steps}

runtime_cfg:
  validate_edge_batch: false
  avoid_revisit: true
  inverse_relation_suffix: "__inv"
  strict_inverse: true

optimizer_cfg:
  type: adamw
  lr: 5.0e-5
  weight_decay: 1.0e-4
  auto_param_groups: true
  param_group_overrides:
    - names: ["*.logit_scale"]
      weight_decay: 0.0

scheduler_cfg:
  type: ""

training_cfg:
  accumulate_grad_batches: 1
  num_rollouts: 5
  metrics:
    mode: minimal

evaluation_cfg:
  beam_size: 50
  beam_sizes: [1, 10, 25, 50]
  diverse_beam:
    enabled: true
    groups: 4
    penalty: hard
    similarity: tail
    lambda: 1.0
